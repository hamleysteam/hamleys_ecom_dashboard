<body>

<script>
// ═══ AUTH ═══════════════════════════════════════════════
const SALT="hamleys_ril_2026";
async function sha256(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+SALT));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
// Baked-in users — sneha password="password", others=username@Ham2026!
let USERS=[
  {username:"sneha",       hash:"8169e9f45ccc9244dc05dacb618349b098335be16c8ba164d0b92c109b12fb09",name:"Sneha",        role:"admin"},
  {username:"kanisht",     hash:"0e5045b1e7e3d347b9232b6d03b3c355b7cf952cbe1b7e2cc66376a1ae048701",name:"Kanisht",      role:"admin"},
  {username:"sunil",       hash:"14f591b15d82aab030d2bbbce273c10e40af45411de96607aab0bee89fd9278c",name:"Sunil",        role:"editor"},
  {username:"suruchi",     hash:"ebcb25bb5713b5fc962b02b1dc780f0857e76fdc5349fa1f348f7fbd7c3c343c",name:"Suruchi",      role:"editor"},
  {username:"vaibhavshree",hash:"37cb682a84e81eeb4e18a15bd257f5d2e63c4e4429b2aa85fc67120ba8fea333",name:"Vaibhavshree", role:"editor"},
];
let CU=null, AT="weekly", CHANNEL="all";

async function initUsers(){
  try{
    const saved=JSON.parse(localStorage.getItem("hm_u6")||"null");
    if(saved&&Array.isArray(saved)){
      saved.forEach(u=>{
        const orig=USERS.find(x=>x.username===u.username);
        if(orig) orig.hash=u.hash;
        else USERS.push(u);
      });
    }
  }catch(e){}
}

async function doLogin(){
  const u=document.getElementById("liu").value.trim().toLowerCase();
  const p=document.getElementById("lip").value;
  const h=await sha256(p);
  const f=USERS.find(x=>x.username===u&&x.hash===h);
  if(!f){
    document.getElementById("lerr").style.display="block";
    document.getElementById("lip").value="";
    return;
  }
  CU=f;
  localStorage.setItem("hm_s6",JSON.stringify({u:f.username,ts:Date.now()}));
  showApp();
}

function doLogout(){
  CU=null;
  localStorage.removeItem("hm_s6");
  document.getElementById("app").style.display="none";
  document.getElementById("ls").style.display="flex";
  document.getElementById("lip").value="";
  document.getElementById("liu").value="";
  document.getElementById("lerr").style.display="none";
}

async function checkSess(){
  try{
    const s=JSON.parse(localStorage.getItem("hm_s6")||"null");
    if(!s||Date.now()-s.ts>8*3600000){localStorage.removeItem("hm_s6");return false;}
    const f=USERS.find(x=>x.username===s.u);
    if(!f)return false;
    CU=f;return true;
  }catch(e){return false;}
}

function showApp(){
  document.getElementById("ls").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("hdr-u").textContent=CU.name+" · "+CU.role.toUpperCase();
  const ed=CU.role==="admin"||CU.role==="editor";
  document.getElementById("t-up").style.display=ed?"":"none";
  document.getElementById("t-ad").style.display=CU.role==="admin"?"":"none";
  updateHdr();render();
}

// ═══ SUPABASE ════════════════════════════════════════════
const SUPA={
  url:"https://zfeuxhjibanaufsagdbm.supabase.co",
  key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZXV4aGppYmFuYXVmc2FnZGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTM0OTAsImV4cCI6MjA5NjIyOTQ5MH0.6APcfYAV1PgvSK_wjymB2QR9IHg_AITGjvk9KMV5RBc"
};

async function supaFetch(path,method,body){
  try{
    const res=await fetch(SUPA.url+"/rest/v1/"+path,{
      method:method||"GET",
      headers:{"Content-Type":"application/json","apikey":SUPA.key,"Authorization":"Bearer "+SUPA.key,"Prefer":method==="POST"?"resolution=merge-duplicates,return=minimal":""},
      body:body?JSON.stringify(body):null
    });
    if(!res.ok)return null;
    return method==="GET"?res.json():true;
  }catch(e){return null;}
}

async function saveToSupa(fid,parsed,meta){
  return await supaFetch("dashboard_files","POST",{
    file_id:fid,file_name:meta.name,row_count:parsed.rows||0,
    date_range:meta.dateRange||"",uploaded_by:CU.name,
    uploaded_at:new Date().toISOString(),data_json:parsed
  });
}

async function loadFromSupa(){
  const data=await supaFetch("dashboard_files?select=*&order=uploaded_at.desc");
  if(!data||!data.length)return false;
  const seen={};
  data.forEach(row=>{
    if(seen[row.file_id])return;
    seen[row.file_id]=true;
    FD[row.file_id]=row.data_json;
    US[row.file_id]={name:row.file_name,rows:row.row_count,done:true,
      dateRange:row.date_range,by:row.uploaded_by,
      ts:new Date(row.uploaded_at).toLocaleString(),shared:true};
  });
  M=compute(FD);
  return true;
}

// ═══ HELPERS ════════════════════════════════════════════
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const toISO=v=>{
  if(!v&&v!==0)return null;
  if(v instanceof Date)return v.toISOString().split("T")[0];
  const d=new Date(Date.UTC(1899,11,30));
  d.setUTCDate(d.getUTCDate()+Math.floor(+v));
  return d.toISOString().split("T")[0];
};
const toN=v=>{if(!v&&v!==0)return 0;const s=String(v).trim();if(s==="-"||s==="")return 0;const n=parseFloat(s);return isNaN(n)?0:n;};
const fL=v=>"₹"+(v/1e5).toFixed(2)+"L";
const fCr=v=>"₹"+(v/1e7).toFixed(2)+"Cr";
const fN=v=>Math.round(+v).toLocaleString("en-IN");
const fP=v=>(+v).toFixed(1)+"%";
const fX=v=>(+v).toFixed(2)+"x";
const chg=(a,b)=>b&&b!==0?(a-b)/Math.abs(b)*100:null;
const bet=(d,s,e)=>!!d&&d>=s&&d<=e;
const cl=v=>Math.max(0,Math.min(100,v));
const fmtDate=iso=>{if(!iso)return"—";const[y,m,d]=iso.split("-");return(+d)+" "+MON[+m-1]+" "+y;};

function bdg(v,inv){
  if(v===null||v===undefined)return'<span style="color:#bbb;font-size:10px">—</span>';
  const ok=inv?v<=0:v>=0;
  return'<span class="'+(ok?"bup":"bdn")+'">'+(v>=0?"+":"")+v.toFixed(1)+"%</span>";
}

// ═══ PERIODS ════════════════════════════════════════════
function getPeriods(mx){
  if(!mx)return null;
  const D=new Date(mx+"T00:00:00Z");
  const y=D.getUTCFullYear(),m=D.getUTCMonth(),d=D.getUTCDate();
  const s=(yr,mo,dy)=>new Date(Date.UTC(yr,mo,Math.max(1,Math.min(31,dy)))).toISOString().split("T")[0];
  const dow=D.getUTCDay(),db=dow===0?6:dow-1;
  return{
    mtdS:s(y,m,1),mtdE:s(y,m,d),
    pmS:s(y,m-1,1),pmE:s(y,m-1,d),
    lylS:s(y-1,m,1),lylE:s(y-1,m,d),
    wtdS:s(y,m,d-db),wtdE:s(y,m,d),
    pwS:s(y,m,d-db-7),pwE:s(y,m,d-7),
    d,month:MON[m],prevMonth:MON[(m+11)%12],
    year:y,monthNum:m+1,label:d+" "+MON[m]+" "+y
  };
}

// ═══ XLSB READER ════════════════════════════════════════
// xlsb = ZIP container with binary streams per sheet.
// Strategy: use JSZip to build a MINIMAL ZIP containing only
// the needed worksheet + essential metadata — skipping the
// 111MB external link and 90MB pivot caches in Sales Dump.

function patchStream(buf){
  var SKIP=new Set([0x3b,0x4a,0x4b,0x23f,0x240,0x241,0x242,0x239,0x23a,0x23b,0x23c,0x23d,0x23e]);
  var src=new Uint8Array(buf),out=new Uint8Array(src.length),si=0,oi=0;
  while(si<src.length-1){
    var rt=src[si],tl=1;
    if(rt&0x80){if(si+1>=src.length)break;rt=(rt&0x7F)|(src[si+1]<<7);tl=2;}
    var rs=0,sl=0;
    for(var j=0;j<4;j++){var idx=si+tl+j;if(idx>=src.length)break;var b=src[idx];rs|=(b&0x7F)<<(7*j);sl++;if(!(b&0x80))break;}
    var rec=tl+sl+rs;
    if(rec<=0||rec>5000000){si++;continue;}
    if(SKIP.has(rt)){si+=rec;}
    else{var e=Math.min(si+rec,src.length);out.set(src.subarray(si,e),oi);oi+=e-si;si+=rec;}
  }
  return out.buffer.slice(0,oi);
}

// Parse workbook.bin.rels XML: returns {id: {target, type}}
function parseRels(xmlStr){
  var map={},re=/<Relationship\s+Id="([^"]+)"\s+Type="([^"]+)"\s+Target="([^"]+)"/g,m;
  while((m=re.exec(xmlStr))!==null){
    map[m[1]]={type:m[2].split("/").pop(),target:m[3]};
  }
  return map;
}
// Rebuild rels XML keeping only relationships of the given types
function filterRelsXml(xmlStr,keepTypes){
  var head=xmlStr.slice(0,xmlStr.indexOf(">")+1);
  var out=head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  var re=/<Relationship\s+Id="([^"]+)"\s+Type="([^"]+)"\s+Target="([^"]+)"\s*\/>/g,m;
  while((m=re.exec(xmlStr))!==null){
    var type=m[2].split("/").pop();
    if(keepTypes.indexOf(type)>=0)out+=m[0];
  }
  return out+"</Relationships>";
}
// Strip [Content_Types].xml Override entries for parts we excluded from the minimal ZIP
function filterContentTypes(xmlStr,excludePartRegexes){
  return xmlStr.replace(/<Override\s+PartName="([^"]+)"[^>]*\/>/g,function(tag,part){
    for(var i=0;i<excludePartRegexes.length;i++){if(excludePartRegexes[i].test(part))return"";}
    return tag;
  });
}

async function getSheetNames(buf){
  var o={type:"array",raw:true,WTF:false,bookSheets:true,bookVBA:false};
  try{var w=XLSX.read(new Uint8Array(buf),o);if(w.SheetNames&&w.SheetNames.length)return w.SheetNames;}catch(e){}
  return null;
}

async function readSheets(buf,sheets){
  var base={type:"array",raw:true,cellDates:false,WTF:false,cellStyles:false,bookVBA:false};
  var o=sheets?Object.assign({},base,{sheets:sheets}):base;
  try{var w=XLSX.read(new Uint8Array(buf),o);if(w)return w;}catch(e){}
  try{var w2=XLSX.read(new Uint8Array(buf),Object.assign({},o,{dense:true}));if(w2)return w2;}catch(e){}
  throw new Error("Cannot parse file.");
}

async function readWb(buf,fid){
  var names=await getSheetNames(buf);
  if(!names)throw new Error("Cannot read sheet names.");
  var needed=null;
  if(fid==="sales_dump"){
    var d=names.find(function(n){return n==="Dump";})||
          names.find(function(n){return n.toLowerCase()==="dump";})||
          names.find(function(n){return n.toLowerCase().endsWith("dump")&&!n.toLowerCase().includes("category");});
    needed=d?[d]:null;
  }else if(fid==="dsr"){
    needed=names.filter(function(n){
      var nl=n.toLowerCase();
      return nl.includes("hm.in")||nl.includes("ajio")||nl.includes("amazon")||nl.includes("jiomart");
    });
    if(!needed.length)needed=names.filter(function(n){return n.toLowerCase().startsWith("dsr");});
  }

  if(typeof JSZip!=="undefined"){
    try{
      var zip=await JSZip.loadAsync(buf);
      var relsEntry=zip.files["xl/_rels/workbook.bin.rels"];
      var relsXml=relsEntry?await relsEntry.async("text"):"";
      var relMap=parseRels(relsXml); // {rId: {target,type}}

      // Map sheet name → worksheet path. Sheet order in `names` corresponds to
      // rId1, rId2, ... rIdN in document order (standard Excel xlsb layout).
      var nameToPath={};
      names.forEach(function(n,i){
        var rel=relMap["rId"+(i+1)];
        if(rel&&rel.type==="worksheet"&&/^worksheets\/sheet\d+\.bin$/.test(rel.target)){
          nameToPath[n]="xl/"+rel.target;
        }
      });
      var neededPaths=needed?needed.map(function(n){return nameToPath[n];}).filter(Boolean):[];

      if(neededPaths.length===needed.length){
        // Build a MINIMAL ZIP: keep only worksheet/styles/sharedStrings/theme
        // relationships and only the needed worksheet file(s) — drop the
        // multi-MB external links, pivot caches, calcChain, metadata etc.
        var minZip=new JSZip();
        var essential=["_rels/.rels","xl/workbook.bin","xl/styles.bin","xl/sharedStrings.bin","xl/theme/theme1.xml"];
        for(var ei=0;ei<essential.length;ei++){
          var ef=zip.files[essential[ei]];if(ef)minZip.file(essential[ei],await ef.async("arraybuffer"));
        }
        var ctEntry=zip.files["[Content_Types].xml"];
        if(ctEntry){
          var ctXml=await ctEntry.async("text");
          ctXml=filterContentTypes(ctXml,[/metadata\.bin$/,/calcChain\.bin$/,/^\/xl\/externalLinks\//,/^\/xl\/pivotCache\//,/^\/xl\/model\//,/^\/xl\/connections\.bin$/]);
          minZip.file("[Content_Types].xml",ctXml);
        }
        if(relsEntry){
          var filtered=filterRelsXml(relsXml,["worksheet","styles","sharedStrings","theme"]);
          minZip.file("xl/_rels/workbook.bin.rels",filtered);
        }
        for(var pi=0;pi<neededPaths.length;pi++){
          var wsf=zip.files[neededPaths[pi]];
          if(wsf)minZip.file(neededPaths[pi],patchStream(await wsf.async("arraybuffer")));
        }
        var minBuf=await minZip.generateAsync({type:"arraybuffer",compression:"STORE"});
        try{return await readSheets(minBuf,needed);}
        catch(e){console.warn("Minimal ZIP read failed:",e.message);}
      }

      // Fallback: patch ALL worksheet streams in the full zip and re-read
      var zipEntries=Object.entries(zip.files);
      var patchedAny=false;
      for(var zi=0;zi<zipEntries.length;zi++){
        var zp=zipEntries[zi][0],zf=zipEntries[zi][1];
        if(!zf.dir&&/^xl\/worksheets\/sheet\d+\.bin$/.test(zp)){
          zip.file(zp,patchStream(await zf.async("arraybuffer")));
          patchedAny=true;
        }
      }
      if(patchedAny){
        var fullBuf=await zip.generateAsync({type:"arraybuffer",compression:"STORE"});
        try{return await readSheets(fullBuf,needed);}
        catch(e){console.warn("Patched full ZIP read failed:",e.message);}
      }
    }catch(e){console.warn("JSZip error:",e.message);}
  }
  return readSheets(buf,needed);
}

// Normalize a header cell: lowercase, underscores→space, collapse whitespace/newlines
function normHdr(h){
  return String(h==null?"":h).toLowerCase().replace(/[\n\r_]+/g," ").replace(/\s+/g," ").trim();
}
// Find a column index by trying exact-match candidates first (in order, across all),
// then substring-match candidates (in order, across all). Returns -1 if none found.
function findCol(hdr,candidates){
  var norm=hdr.map(normHdr);
  for(var c=0;c<candidates.length;c++){
    var cand=normHdr(candidates[c]);
    var idx=norm.indexOf(cand);
    if(idx>=0)return idx;
  }
  for(var c=0;c<candidates.length;c++){
    var cand=normHdr(candidates[c]);
    for(var i=0;i<norm.length;i++){if(norm[i].indexOf(cand)>=0)return i;}
  }
  return -1;
}

function parseDSRSheet(wb,sheetName){
  const sh=wb.Sheets[sheetName];if(!sh)return{recs:[],colMap:{},detected:[]};
  const raw=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  const fx=DSR_FX[sheetName];
  if(!fx)return{recs:[],colMap:{},detected:[]};

  // Detect header row: look for a row where col0="Platform" and col1="Tag" (exact)
  var hr=fx.hr;
  for(let i=0;i<Math.min(8,raw.length);i++){
    const r=raw[i];if(!r)continue;
    if(normHdr(r[0])==="platform"&&normHdr(r[1])==="tag"){hr=i;break;}
  }
  const hdr=raw[hr]||[];

  // Date / Tag columns — by name, fallback to fixed
  var dc=findCol(hdr,["start date"]); if(dc<0)dc=fx.dc;
  var tc=findCol(hdr,["tag"]); if(tc<0)tc=fx.tc;

  // Build column map: try header-name match first, fallback to validated fixed position
  const cm={},detected=[];
  for(const key in DSR_NAMES){
    var idx=findCol(hdr,DSR_NAMES[key]);
    var src="name";
    if(idx<0){idx=fx[DSR_FX_KEY[key]];src=idx>=0?"fixed":"missing";}
    cm[key]=idx;
    detected.push({key:key,idx:idx,header:idx>=0&&idx<hdr.length?hdr[idx]:null,src:src});
  }

  const recs=[];
  for(let i=hr+1;i<raw.length;i++){
    const r=raw[i];if(!r)continue;
    if(String(r[tc]||"").toLowerCase()!=="daily")continue;
    const date=toISO(r[dc]);if(!date)continue;
    const rec={date};
    for(const k in cm){const c=cm[k];rec[k]=c>=0&&c<r.length?toN(r[c]):0;}
    recs.push(rec);
  }
  const dates=recs.map(r=>r.date).sort();
  return{recs,colMap:cm,detected,headerRow:hr,dateCol:dc,tagCol:tc,
    minDate:dates[0]||null,maxDate:dates[dates.length-1]||null};
}

function parseDSR(wb){
  const ns=wb.SheetNames;
  const findSh=function(){
    const kws=Array.prototype.slice.call(arguments);
    for(let i=0;i<kws.length;i++){const e=ns.find(n=>n.trim()===kws[i].trim());if(e)return e;}
    for(let i=0;i<kws.length;i++){const p=ns.find(n=>n.toLowerCase().includes(kws[i].toLowerCase()));if(p)return p;}
    return null;
  };
  const hmSh=findSh("DSR - HM.in","DSR-HM.in","HM.in")||ns[0];
  const ajSh=findSh("DSR - AJIO","DSR-AJIO","AJIO");
  const amSh=findSh("DSR - Amazon","DSR-Amazon","Amazon");
  const jmSh=findSh("DSR - Jiomart","DSR-Jiomart","Jiomart");
  const hm=parseDSRSheet(wb,hmSh);
  const ajio=ajSh?parseDSRSheet(wb,ajSh):{recs:[],colMap:{}};
  const amazon=amSh?parseDSRSheet(wb,amSh):{recs:[],colMap:{}};
  const jiomart=jmSh?parseDSRSheet(wb,jmSh):{recs:[],colMap:{}};
  const dates=[].concat(hm.recs,ajio.recs).map(r=>r.date).sort();

    sheetsFound:{hm:hmSh,ajio:ajSh,amazon:amSh,jiomart:jmSh}};
}

    wb.SheetNames.find(n=>n.toLowerCase().endsWith("dump")&&!n.toLowerCase().includes("category"))||

function parseCamp(wb){
  const rows=[];
  for(const sn of wb.SheetNames){
    (XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null})||[]).forEach(r=>{
      if(!r||!r[0])return;
      const nm=String(r[0]).trim();
      if(["campaign","total","","nan"].includes(nm.toLowerCase()))return;
      const sp=toN(r[1]),rv=toN(r[2]);
      if(sp>100)rows.push({campaign:nm,sheet:sn,spends:sp,revenue:rv,roas:rv>0&&sp>0?rv/sp:0});
    });

  return{campaigns:rows,rows:rows.length};
}

function parseCatalog(wb){

  }
  const hdr=raw[hi]||[];

    const kws=Array.prototype.slice.call(arguments);
    for(let k=0;k<kws.length;k++){

    const lv=String(r[lvC>=0?lvC:""]||"").toLowerCase();
    recs.push({article:art,desc:String(r[deC>=0?deC:1]||"").trim().slice(0,60),
      brand:String(r[brC>=0?brC:2]||"").trim(),category:String(r[caC>=0?caC:3]||"").trim(),
      is_live:lv==="true"||lv==="1"||lv==="yes"||lv==="active",
      mrp:toN(r[mrC>=0?mrC:0]),soh:toN(r[soC>=0?soC:0])});
  }
  return{recs,rows:recs.length,minDate:null,maxDate:null};
}

function parseStoreTracker(wb){
  const sh=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  let hi=0;
  for(let i=0;i<Math.min(5,raw.length);i++){
    const r=raw[i];if(!r)continue;
    if(r.some(v=>v&&(String(v).toLowerCase().includes("store")||String(v).toLowerCase().includes("live")))){hi=i;break;}
  }
  const hdr=raw[hi]||[];
  const idxOf=function(){
    const kws=Array.prototype.slice.call(arguments);
    for(let k=0;k<kws.length;k++){
      const idx=hdr.findIndex(h=>h&&String(h).toLowerCase().includes(kws[k].toLowerCase()));
      if(idx>=0)return idx;
    }
    return -1;
  };
  const nmC=idxOf("store name","store","name"),cdC=idxOf("store code","code"),
    lvC=idxOf("live sku","live skus","active skus","live"),
    ordC=idxOf("orders","order"),revC=idxOf("revenue","rev","booking rev"),
    fillC=idxOf("fill rate","fill"),canC=idxOf("cancel","cancellation"),
    cityC=idxOf("city","location");
  const recs=[];
  for(let i=hi+1;i<raw.length;i++){
    const r=raw[i];if(!r)continue;
    const name=String(r[nmC>=0?nmC:0]||"").trim();
    if(!name||["total","grand total"].includes(name.toLowerCase()))continue;
    recs.push({name,code:String(r[cdC>=0?cdC:0]||"").trim(),
      city:String(r[cityC>=0?cityC:""]||"").trim(),
      live_skus:toN(r[lvC>=0?lvC:0]),orders:toN(r[ordC>=0?ordC:0]),
      revenue:toN(r[revC>=0?revC:0]),fill_rate:toN(r[fillC>=0?fillC:0]),
      cancel_pct:toN(r[canC>=0?canC:0])});
  }
  return{recs,rows:recs.length,minDate:null,maxDate:null};
}

// ═══ TARGETS from DSR ══════════════════════════════════
function getTargets(P,dsr){
  if(!P||!dsr)return{booked:null,gross:null,total:null,ajio:null,amazon:null,jiomart:null};
  const mk=P.year+"-"+String(P.monthNum).padStart(2,"0");
  const msum=function(recs,field){
    return(recs||[]).filter(function(r){return r.date.startsWith(mk);}).reduce(function(s,r){return s+(r[field]||0);},0);
  };
  const booked=msum(dsr.hm&&dsr.hm.recs,"target");
  const gross=msum(dsr.hm&&dsr.hm.recs,"target_gross");
  const ajio=msum(dsr.ajio&&dsr.ajio.recs,"target");
  const am=msum(dsr.amazon&&dsr.amazon.recs,"target");
  const jm=msum(dsr.jiomart&&dsr.jiomart.recs,"target");
  const total=(booked||0)+(ajio||0)+(am||0)+(jm||0);
  return{booked:booked||null,gross:gross||null,total:total||null,
    ajio:ajio||null,amazon:am||null,jiomart:jm||null};
}

// ═══ AGGREGATE ══════════════════════════════════════════
function agg(recs,s,e,keys){
  const f=recs.filter(function(r){return bet(r.date,s,e);});
  const o={n:f.length};
  for(let i=0;i<keys.length;i++){
    const k=keys[i];
    o[k]=f.reduce(function(a,r){return a+(r[k]||0);},0);
  }
  return o;
}
function avgK(recs,s,e,k){
  const f=recs.filter(function(r){return bet(r.date,s,e);});
  return f.length?f.reduce(function(a,r){return a+(r[k]||0);},0)/f.length:0;
}

// ═══ COMPUTE ════════════════════════════════════════════
function compute(fd){
  const sd=fd.sales_dump,dsr=fd.dsr,camp=fd.campaign;
  const maxDate=(sd&&sd.maxDate)||(dsr&&dsr.maxDate)||null;
  if(!maxDate)return null;
  const P=getPeriods(maxDate);
  const TGT=getTargets(P,dsr);
  const DK=["rev","mrp","net","orders","units","disc_pct","aov","cancel_pct","fill_rate",
    "store_cancel","cust_cancel","return_pct","live_sku","sku_sold","live_store",
    "spends","fb_spends","google_spends","awareness","roas","roas_fb","roas_gg",
    "target","target_gross","prepaid_pct","ga4_sessions","sessions","pageviews",
    "pdp_views","ecom_conv","users"];
  const SA=function(s,e){return sd?agg(sd.recs,s,e,["gross","coupon","store_d","total_d","orders","units","rev","net","cancel_qty","return_qty"]):{}};
  const DA=function(ch,s,e){return dsr&&dsr[ch]&&dsr[ch].recs?agg(dsr[ch].recs,s,e,DK):{}};
  const AV=function(ch,s,e,k){return avgK((dsr&&dsr[ch]&&dsr[ch].recs)||[],s,e,k);};
  const sm=SA(P.mtdS,P.mtdE),sp=SA(P.pmS,P.pmE),sw=SA(P.wtdS,P.wtdE),spw=SA(P.pwS,P.pwE);
  const hmM=DA("hm",P.mtdS,P.mtdE),hmP=DA("hm",P.pmS,P.pmE),hmW=DA("hm",P.wtdS,P.wtdE),hmPW=DA("hm",P.pwS,P.pwE);
  const ajM=DA("ajio",P.mtdS,P.mtdE),ajP=DA("ajio",P.pmS,P.pmE),ajW=DA("ajio",P.wtdS,P.wtdE),ajPW=DA("ajio",P.pwS,P.pwE);
  const amM=DA("amazon",P.mtdS,P.mtdE),amP=DA("amazon",P.pmS,P.pmE);
  const jmM=DA("jiomart",P.mtdS,P.mtdE),jmP=DA("jiomart",P.pmS,P.pmE);
  const totalM=(hmM.rev||0)+(ajM.rev||0)+(amM.rev||0)+(jmM.rev||0);
  const totalP=(hmP.rev||0)+(ajP.rev||0)+(amP.rev||0)+(jmP.rev||0);

  // Brand/category/seller rollups
  const BR=function(s,e){
    if(!sd)return{};
    const m={};
    sd.recs.filter(function(r){return bet(r.date,s,e);}).forEach(function(r){
      if(!m[r.brand])m[r.brand]={rev:0,orders:0,units:0,gross:0,disc:0};
      m[r.brand].rev+=r.rev;m[r.brand].orders+=r.orders;m[r.brand].units+=r.units;
      m[r.brand].gross+=r.gross;m[r.brand].disc+=r.total_d;
    });
    return m;
  };
  const CR=function(s,e){
    if(!sd)return{};
    const m={};
    sd.recs.filter(function(r){return bet(r.date,s,e);}).forEach(function(r){
      const c=r.category||"Other";
      if(!m[c])m[c]={rev:0,units:0,orders:0,gross:0,disc:0,store_d:0,coupon:0};
      m[c].rev+=r.rev;m[c].units+=r.units;m[c].orders+=r.orders;
      m[c].gross+=r.gross;m[c].disc+=r.total_d;m[c].store_d+=r.store_d;m[c].coupon+=r.coupon;
    });
    return m;
  };
  const TR=function(s,e){
    if(!sd)return{};
    const m={};
    sd.recs.filter(function(r){return bet(r.date,s,e);}).forEach(function(r){
      const k=r.article||r.desc;if(!k)return;
      if(!m[k])m[k]={desc:r.desc,brand:r.brand,cat:r.category,rev:0,units:0,orders:0};
      m[k].rev+=r.rev;m[k].units+=r.units;m[k].orders+=r.orders;
    });
    return m;
  };
  const bM=BR(P.mtdS,P.mtdE),bP=BR(P.pmS,P.pmE),bW=BR(P.wtdS,P.wtdE),bPW=BR(P.pwS,P.pwE),bLY=BR(P.lylS,P.lylE);
  const cM=CR(P.mtdS,P.mtdE),cP=CR(P.pmS,P.pmE),cW=CR(P.wtdS,P.wtdE),cPW=CR(P.pwS,P.pwE);
  const tM=TR(P.mtdS,P.mtdE),tP=TR(P.pmS,P.pmE),tW=TR(P.wtdS,P.wtdE),tPW=TR(P.pwS,P.pwE);
  const allBr=Array.from(new Set(Object.keys(bM).concat(Object.keys(bP)))).filter(Boolean);
  const brands=allBr.map(function(b){
    return{brand:b,mtdR:bM[b]?bM[b].rev:0,pmR:bP[b]?bP[b].rev:0,wtdR:bW[b]?bW[b].rev:0,
      pwR:bPW[b]?bPW[b].rev:0,lyR:bLY[b]?bLY[b].rev:0,
      units:bM[b]?bM[b].units:0,orders:bM[b]?bM[b].orders:0,
      dPct:bM[b]&&bM[b].gross>0?bM[b].disc/bM[b].gross*100:0,
      dPctP:bP[b]&&bP[b].gross>0?bP[b].disc/bP[b].gross*100:0,
      wDPct:bW[b]&&bW[b].gross>0?bW[b].disc/bW[b].gross*100:0,
      pwDPct:bPW[b]&&bPW[b].gross>0?bPW[b].disc/bPW[b].gross*100:0};
  }).sort(function(a,b){return b.mtdR-a.mtdR;}).slice(0,20);
  const allCat=Array.from(new Set(Object.keys(cM).concat(Object.keys(cP)))).filter(function(c){return c&&c!=="Other";});
  const categories=allCat.map(function(c){
    return{cat:c,mtdR:cM[c]?cM[c].rev:0,pmR:cP[c]?cP[c].rev:0,
      wtdR:cW[c]?cW[c].rev:0,pwR:cPW[c]?cPW[c].rev:0,
      units:cM[c]?cM[c].units:0,orders:cM[c]?cM[c].orders:0,
      dPct:cM[c]&&cM[c].gross>0?cM[c].disc/cM[c].gross*100:0,
      dPctP:cP[c]&&cP[c].gross>0?cP[c].disc/cP[c].gross*100:0,
      wDPct:cW[c]&&cW[c].gross>0?cW[c].disc/cW[c].gross*100:0,
      pwDPct:cPW[c]&&cPW[c].gross>0?cPW[c].disc/cPW[c].gross*100:0,
      storeD:cM[c]&&cM[c].gross>0?cM[c].store_d/cM[c].gross*100:0,
      couponD:cM[c]&&cM[c].gross>0?cM[c].coupon/cM[c].gross*100:0};
  }).sort(function(a,b){return b.mtdR-a.mtdR;});
  const allSKU=Array.from(new Set(Object.keys(tM).concat(Object.keys(tP))));
  const topSellers=allSKU.map(function(k){
    return{desc:((tM[k]&&tM[k].desc)||(tP[k]&&tP[k].desc)||k).slice(0,50),
      brand:(tM[k]&&tM[k].brand)||"",cat:(tM[k]&&tM[k].cat)||"",
      mtdR:tM[k]?tM[k].rev:0,pmR:tP[k]?tP[k].rev:0,
      wtdR:tW[k]?tW[k].rev:0,pwR:tPW[k]?tPW[k].rev:0,
      mtdU:tM[k]?tM[k].units:0,pmU:tP[k]?tP[k].units:0};
  }).sort(function(a,b){return b.mtdR-a.mtdR;}).slice(0,25);

  const disc={
    M:{tot:sm.gross>0?sm.total_d/sm.gross*100:0,store:sm.gross>0?sm.store_d/sm.gross*100:0,coupon:sm.gross>0?sm.coupon/sm.gross*100:0},
    P:{tot:sp.gross>0?sp.total_d/sp.gross*100:0,store:sp.gross>0?sp.store_d/sp.gross*100:0,coupon:sp.gross>0?sp.coupon/sp.gross*100:0},
    W:{tot:sw.gross>0?sw.total_d/sw.gross*100:0,store:sw.gross>0?sw.store_d/sw.gross*100:0,coupon:sw.gross>0?sw.coupon/sw.gross*100:0},
    PW:{tot:spw.gross>0?spw.total_d/spw.gross*100:0,store:spw.gross>0?spw.store_d/spw.gross*100:0,coupon:spw.gross>0?spw.coupon/spw.gross*100:0}
  };
  const days=Math.max(1,(new Date(P.mtdE)-new Date(P.mtdS))/86400e3+1);
  return{P,TGT,maxDate,days,
    summary:{totalM,totalP,grossM:sm.gross,bookedM:hmM.rev||0,
      projBooked:(hmM.rev||0)/days*30,projTotal:totalM/days*30,projGross:sm.gross/days*30},
    ch:{
      hm:{M:hmM,P:hmP,W:hmW,PW:hmPW,
        canM:AV("hm",P.mtdS,P.mtdE,"cancel_pct"),canP:AV("hm",P.pmS,P.pmE,"cancel_pct"),
        fillM:AV("hm",P.mtdS,P.mtdE,"fill_rate"),
        aovM:hmM.orders>0?hmM.rev/hmM.orders:0,aovP:hmP.orders>0?hmP.rev/hmP.orders:0,
        aovW:hmW.orders>0?hmW.rev/hmW.orders:0,aovPW:hmPW.orders>0?hmPW.rev/hmPW.orders:0,
        roasM:hmM.spends>0?hmM.rev/hmM.spends:0},
      ajio:{M:ajM,P:ajP,W:ajW,PW:ajPW,canM:AV("ajio",P.mtdS,P.mtdE,"cancel_pct"),aovM:ajM.orders>0?ajM.rev/ajM.orders:0,aovP:ajP.orders>0?ajP.rev/ajP.orders:0},
      amazon:{M:amM,P:amP},jiomart:{M:jmM,P:jmP}
    },
    brands,categories,topSellers,disc,campaigns:(camp&&camp.campaigns)||[]};
}

async function handleFile(fid,file){
  if(!file)return;
  US[fid]={name:file.name,parsing:true};render();
  try{
    const buf=await file.arrayBuffer();
    const wb=await readWb(buf,fid);
    let parsed=null;
    if(fid==="sales_dump")parsed=parseDump(wb);
    else if(fid==="dsr")parsed=parseDSR(wb);
    else if(fid==="campaign")parsed=parseCamp(wb);
    else if(fid==="store_tracker")parsed=parseStoreTracker(wb);
    else parsed=parseCatalog(wb);
    FD[fid]=parsed;M=compute(FD);
    const dr=parsed.minDate&&parsed.maxDate?fmtDate(parsed.minDate)+" → "+fmtDate(parsed.maxDate):"";
    US[fid]={name:file.name,rows:parsed.rows||0,done:true,ts:new Date().toLocaleTimeString(),by:CU.name,dateRange:dr};
    const shared=await saveToSupa(fid,parsed,US[fid]);
    if(shared)US[fid].shared=true;
    saveData();updateHdr();
    // Smart-detection summary: warn if any expected columns weren't found at all
    var warn="";
    if(parsed.detected){
      var missing=parsed.detected.filter(function(d){return d.src==="missing";});
      var byName=parsed.detected.filter(function(d){return d.src==="name";}).length;
      var byFixed=parsed.detected.filter(function(d){return d.src==="fixed";}).length;
      US[fid].detectSummary={total:parsed.detected.length,byName:byName,byFixed:byFixed,missing:missing.map(function(d){return d.key;})};
      if(missing.length)warn=" · ⚠ "+missing.length+" column(s) not found: "+missing.slice(0,4).map(function(d){return d.key;}).join(", ")+(missing.length>4?"…":"");
    }
    if(parsed.hm&&parsed.hm.detected){ // DSR — check HM.in sheet specifically
      var missingHm=parsed.hm.detected.filter(function(d){return d.src==="missing";});
      US[fid].detectSummary={total:parsed.hm.detected.length,byName:parsed.hm.detected.filter(function(d){return d.src==="name";}).length,byFixed:parsed.hm.detected.filter(function(d){return d.src==="fixed";}).length,missing:missingHm.map(function(d){return d.key;})};
      if(missingHm.length)warn=" · ⚠ HM.in: "+missingHm.length+" column(s) not found: "+missingHm.slice(0,4).map(function(d){return d.key;}).join(", ")+(missingHm.length>4?"…":"");
      if(!parsed.sheetsFound.ajio)warn+=" · ⚠ AJIO sheet not found";
      if(!parsed.sheetsFound.amazon)warn+=" · ⚠ Amazon sheet not found";
      if(!parsed.sheetsFound.jiomart)warn+=" · ⚠ Jiomart sheet not found";
    }
    showToast("✓ "+file.name+(dr?" · "+dr:"")+(shared?" · ☁ shared":"")+warn);
  }catch(err){
    US[fid]={name:file.name,error:String(err).slice(0,200)};
    showToast("Error: "+String(err).slice(0,100));
  }
  render();
}

    }
    if(st&&st.error)s+='<div style="font-size:10px;color:var(--err);margin-bottom:5px;padding:5px;background:var(--ebg);border-radius:3px">'+st.error+"</div>";
    s+='<label><div class="dz" id="dz-'+f.id+'">Drop .xlsb / .xlsx or click</div><input type="file" accept=".xlsx,.xlsb,.xls,.csv" onchange="handleFile(\''+f.id+'\',this.files[0])"></label></div>';
  });
  s+="</div>"+(Object.keys(US).length?'<div style="margin-top:12px"><button class="btn-g" onclick="clearAll()">Clear all data</button></div>':"")+"</div>";
  return s;
}

// ═══ TAB: ADMIN ═════════════════════════════════════════
function tabAdmin(){
  if(!CU||CU.role!=="admin")return'<div class="al al-r">Admin access only.</div>';
  var rc={admin:"r-admin",editor:"r-editor",viewer:"r-viewer"};
  var s='<div class="sec"><div class="sh"><span class="sn">⚙</span><span class="st">Team Access Management</span></div>';
  s+='<div class="al al-g" style="font-size:10px">All data — including targets — read directly from uploaded files. Nothing hardcoded. Supabase URL baked in → shared storage active.</div>';
  s+='<div class="ag"><div class="cd"><div class="ct">Current Users</div>';
  USERS.forEach(function(u){
    s+='<div class="aur"><div><div style="font-size:12px;font-weight:500">'+u.name+' <span style="font-family:var(--mono);font-size:10px;color:#999">('+u.username+")</span></div></div>";
    s+='<div style="display:flex;align-items:center;gap:7px"><span class="ar '+(rc[u.role]||"")+'">'+(u.role)+"</span>"+(u.username!=="sneha"&&u.username!=="kanisht"?'<button class="adel" onclick="delUser(\''+u.username+'\')">✕</button>':"")+"</div></div>";
  });
  s+='</div><div class="cd"><div class="ct">Add / Update User</div>';
  s+='<div class="fr"><input id="nu-n" class="fi" type="text" placeholder="Full name"><input id="nu-u" class="fi" type="text" placeholder="Username (lowercase)"></div>';
  s+='<div class="fr"><input id="nu-p" class="fi" type="password" placeholder="Password"><select id="nu-r" class="fs"><option value="viewer">Viewer</option><option value="editor">Editor</option><option value="admin">Admin</option></select></div>';
  s+='<button class="btn-r" onclick="addUser()">Add / Update →</button>';
  s+='<div style="margin-top:10px;padding:9px;background:var(--bg);border-radius:var(--r);border:1px solid var(--div);font-size:11px;color:#555;line-height:1.9"><span class="ar r-admin">admin</span> Full access<br><span class="ar r-editor">editor</span> Upload + view<br><span class="ar r-viewer">viewer</span> View only</div></div></div></div>';
  return s;
}

// ═══ ADMIN ACTIONS ═══════════════════════════════════════
async function addUser(){
  var n=document.getElementById("nu-n").value.trim();
  var u=document.getElementById("nu-u").value.trim().toLowerCase();
  var p=document.getElementById("nu-p").value;
  var r=document.getElementById("nu-r").value;
  if(!n||!u||!p){showToast("Fill all fields");return;}
  var h=await sha256(p);
  var idx=USERS.findIndex(function(x){return x.username===u;});
  if(idx>=0)USERS[idx]={username:u,name:n,hash:h,role:r};
  else USERS.push({username:u,name:n,hash:h,role:r});
  localStorage.setItem("hm_u6",JSON.stringify(USERS));
  showToast("✓ "+n+" ("+r+") saved");render();
}
function delUser(u){
  if(!confirm("Remove "+u+"?"))return;
  USERS=USERS.filter(function(x){return x.username!==u;});
  localStorage.setItem("hm_u6",JSON.stringify(USERS));
  showToast(u+" removed");render();
}
function clearAll(){
  if(!confirm("Clear all uploaded data?"))return;
  FD={};US={};M=null;
  localStorage.removeItem("hm_fd7");localStorage.removeItem("hm_st7");
  document.getElementById("hdr-d").textContent="No data";
  document.getElementById("ftr-d").textContent="—";
  document.getElementById("ftr-r").textContent="No data";
  render();showToast("Cleared");
}

// ═══ RENDER + NAV ════════════════════════════════════════
function render(){
  var map={weekly:tabWeekly,targets:tabTargets,overview:tabOverview,channels:tabChannels,
    brands:tabBrands,categories:tabCategories,sellers:tabSellers,skus:tabSKUs,
    discounts:tabDiscounts,stores:tabStores,catalog:tabCatalog,
    verify:tabVerify,upload:tabUpload,admin:tabAdmin};
  document.getElementById("content").innerHTML=(map[AT]||tabTargets)();
  FDEFS.forEach(function(f){
    var dz=document.getElementById("dz-"+f.id);if(!dz)return;
    dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("dg");});
    dz.addEventListener("dragleave",function(){dz.classList.remove("dg");});
    dz.addEventListener("drop",async function(e){
      e.preventDefault();dz.classList.remove("dg");
      var file=e.dataTransfer.files[0];if(file)await handleFile(f.id,file);
    });
  });
}

function switchTab(id){
  AT=id;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.tab===id);});
  render();
}

document.getElementById("tabs").addEventListener("click",function(e){
  if(e.target.dataset.tab)switchTab(e.target.dataset.tab);
});
document.getElementById("ch-bar").addEventListener("click",function(e){
  if(!e.target.dataset.ch)return;
  CHANNEL=e.target.dataset.ch;
  document.querySelectorAll(".ch-btn").forEach(function(b){b.classList.toggle("on",b.dataset.ch===CHANNEL);});
  updateHdr();render();
});

// ═══ INIT ════════════════════════════════════════════════
(async function(){
  await initUsers();
  loadData();
  if(await checkSess()){
    var fromSupa=await loadFromSupa();
    if(!fromSupa)loadData();
    showApp();
  }else{
    document.getElementById("liu").focus();
  }
})();
</script>
