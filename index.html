<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamleys eCommerce Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#f50000;--rdk:#cf102d;--blk:#000;--wht:#fff;--acc:#eeeded;--bg:#f7f7f7;--crd:#fff;--div:#efeae9;--hi:#dfd2d4;--grn:#2ba52e;--gbg:#e6f9ee;--err:#B24141;--ebg:#fff5f5;--amb:#D28F51;--abg:#fff359;--blu:#1d4ed8;--bbg:#dbeafe;--r:6px;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--disp:'Bebas Neue',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--blk);font-family:var(--sans);font-size:13px}
#ls{position:fixed;inset:0;z-index:9999;background:var(--blk);display:flex;align-items:center;justify-content:center}
.lb{background:var(--crd);width:400px;border-radius:10px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.lh{background:var(--rdk);padding:26px 30px}
.ll{font-family:var(--disp);font-size:27px;letter-spacing:.12em;color:var(--wht)}
.ls2{font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.06em;font-family:var(--mono);margin-top:3px}
.lbd{padding:26px 30px}
.llab{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#666;margin-bottom:4px;display:block}
.lin{width:100%;padding:9px 11px;border:1px solid var(--div);border-radius:var(--r);font-family:var(--mono);font-size:12px;margin-bottom:12px;outline:none;background:var(--bg)}
.lin:focus{border-color:var(--red)}
.lbtn{width:100%;background:var(--red);color:var(--wht);border:none;padding:10px;border-radius:var(--r);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:3px}
.lbtn:hover{background:var(--rdk)}
.lerr{background:var(--ebg);border:1px solid var(--hi);color:var(--err);font-size:11px;padding:8px 11px;border-radius:var(--r);margin-top:10px;display:none;font-family:var(--mono)}
.lft{padding:12px 30px;background:#f9f9f9;border-top:1px solid var(--div);font-size:10px;color:#999;text-align:center;font-family:var(--mono)}
#app{display:none}
.hdr{background:var(--rdk);color:var(--wht);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(207,16,45,.3)}
.hl{font-family:var(--disp);font-size:23px;letter-spacing:.12em;display:flex;align-items:center;gap:9px}
.hsep{width:1px;height:18px;background:rgba(255,255,255,.25)}
.hsub{font-family:var(--sans);font-size:11px;font-weight:300;opacity:.8;letter-spacing:.07em}
.hr{display:flex;align-items:center;gap:9px}
.hmeta{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.7)}
.huser{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);padding:3px 9px;border-radius:20px}
.hlout{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:3px 9px;border-radius:3px;cursor:pointer;text-transform:uppercase}
.hlout:hover{background:rgba(255,255,255,.1)}
/* CHANNEL SELECTOR */
.ch-bar{background:var(--blk);padding:0 24px;display:flex;align-items:center;gap:0;overflow-x:auto;height:36px}
.ch-bar::-webkit-scrollbar{height:0}
.ch-btn{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#666;padding:0 13px;height:36px;white-space:nowrap;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:all .15s}
.ch-btn:hover{color:#aaa}
.ch-btn.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.ch-meta{font-family:var(--mono);font-size:9px;color:#555;margin-left:auto;padding-right:4px}
/* TABS */
.tabs{background:var(--crd);border-bottom:1px solid var(--div);display:flex;padding:0 24px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#888;padding:11px 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.tab:hover:not(.on){color:var(--blk)}
.main{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
.sec{margin-bottom:26px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--div)}
.sn{font-family:var(--mono);font-size:9px;color:var(--red);background:var(--ebg);padding:1px 6px;border-radius:3px}
.st{font-family:var(--disp);font-size:16px;letter-spacing:.06em}
.ss{font-size:9px;color:#999;margin-left:auto;font-family:var(--mono)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:1px;background:var(--div);border:1px solid var(--div);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.kc{background:var(--crd);padding:13px 15px}
.kl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#999;margin-bottom:5px}
.kv{font-family:var(--disp);font-size:26px;color:var(--blk);line-height:1;margin-bottom:4px}
.kr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kp{font-family:var(--mono);font-size:9px;color:#bbb}
.ke{font-family:var(--mono);font-size:9px;color:var(--grn);margin-top:3px}
.bup{background:var(--gbg);color:var(--grn);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
.bdn{background:var(--ebg);color:var(--err);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tc{background:var(--crd);border:1px solid var(--div);border-radius:var(--r);padding:13px 15px}
.tl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#999;margin-bottom:6px}
.tv{font-family:var(--disp);font-size:23px;letter-spacing:.02em;margin-bottom:6px}
.tbar{background:var(--acc);height:4px;border-radius:2px;overflow:hidden;margin-bottom:5px}
.tfill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.tn{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:#999}
.tw{border:1px solid var(--div);border-radius:var(--r);overflow:hidden;margin-bottom:11px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--blk);color:var(--wht);font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:8px 10px;text-align:left;white-space:nowrap;font-weight:400}
th.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--div)}
td.r{text-align:right;font-family:var(--mono);font-size:11px}
tr:last-child td{border:none}
tr:hover td{background:var(--hi)!important}
tr.t3 td{background:#fff8f8}
tr.ttl td{background:#f9fafb;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:900px){.g2,.g3,.tg{grid-template-columns:1fr}}
.cd{background:var(--crd);border:1px solid var(--div);border-radius:var(--r);padding:13px}
.ct{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#999;margin-bottom:10px}
.ug{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.ug{grid-template-columns:1fr}}
.uc{background:var(--crd);border:1px solid var(--div);border-radius:var(--r);padding:12px 13px}
.uc.done{border-color:var(--grn)}.uc.err{border-color:var(--err)}
.dz{border:1.5px dashed var(--div);border-radius:4px;padding:9px;text-align:center;font-size:11px;color:#999;cursor:pointer;background:var(--bg);transition:all .15s}
.dz:hover,.dg{background:var(--ebg)!important;border-color:var(--red)!important;color:var(--red)!important}
.dz input{display:none}
.al{border-radius:var(--r);padding:9px 12px;font-size:11px;line-height:1.7;margin-bottom:11px}
.al b{color:var(--blk)}
.al-r{background:var(--ebg);border:1px solid var(--hi);border-left:3px solid var(--red)}
.al-g{background:#f0fff6;border:1px solid #b6eece;border-left:3px solid var(--grn)}
.al-a{background:var(--abg);border:1px solid #ffe566;border-left:3px solid var(--amb)}
.al-b{background:var(--bbg);border:1px solid #bfdbfe;border-left:3px solid var(--blu)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.aur{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--div)}
.aur:last-child{border:none}
.ar{font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.r-admin{background:var(--ebg);color:var(--err)}
.r-editor{background:#e8f0ff;color:#1e40af}
.r-viewer{background:var(--gbg);color:var(--grn)}
.adel{background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;padding:2px 5px}
.adel:hover{color:var(--err)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.fi{width:100%;padding:8px 10px;border:1px solid var(--div);border-radius:var(--r);font-family:var(--mono);font-size:11px;outline:none}
.fi:focus{border-color:var(--red)}
.fs{width:100%;padding:8px 10px;border:1px solid var(--div);border-radius:var(--r);font-family:var(--mono);font-size:11px;outline:none;background:var(--crd)}
.btn-r{background:var(--red);color:var(--wht);border:none;padding:8px 15px;border-radius:var(--r);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn-r:hover{background:var(--rdk)}
.btn-g{background:none;border:1px solid var(--div);color:#666;padding:6px 13px;border-radius:var(--r);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.btn-g:hover{border-color:var(--red);color:var(--red)}
.dc3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
.dc{background:var(--crd);border:1px solid var(--div);border-radius:var(--r);padding:12px 14px}
.dp{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dh{background:var(--bg);border-radius:4px;padding:9px 10px}
.dhl{font-size:10px;color:#999;margin-bottom:2px}
.dhv{font-family:var(--disp);font-size:21px;letter-spacing:.02em;margin-bottom:2px}
/* FILL BAR */
.fbar-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--div)}
.fbar-row:last-child{border:none}
.fbar-lbl{font-size:11px;color:#444;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar-bg{width:100px;background:var(--acc);height:8px;border-radius:2px;overflow:hidden;flex-shrink:0}
.fbar-fill{height:100%;border-radius:2px}
.fbar-val{font-family:var(--mono);font-size:11px;min-width:38px;text-align:right}
footer{background:var(--rdk);padding:11px 24px;display:flex;justify-content:space-between;margin-top:32px}
footer span{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.04em}
#toast{position:fixed;bottom:15px;right:15px;background:var(--blk);color:var(--wht);border-radius:var(--r);padding:9px 14px;font-size:11px;z-index:99999;border-left:3px solid var(--red);font-family:var(--mono);display:none;max-width:320px}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--div)}
.vrow:last-child{border:none}
.vlbl{font-size:11px;color:#555}
.vval{font-family:var(--mono);font-size:12px;font-weight:500}
.vsrc{font-family:var(--mono);font-size:9px;color:#bbb}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sec{animation:fadeUp .3s ease both}
</style>
</head>
<body>
<div id="ls">
  <div class="lb">
    <div class="lh"><div class="ll">Hamleys</div><div class="ls2">eCommerce Intelligence · Internal Use Only</div></div>
    <div class="lbd">
      <label class="llab">Username</label>
      <input id="liu" class="lin" type="text" placeholder="Enter username" autocomplete="username">
      <label class="llab">Password</label>
      <input id="lip" class="lin" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lbtn" onclick="doLogin()">Sign In →</button>
      <div class="lerr" id="lerr">Incorrect username or password.</div>
    </div>
    <div class="lft">RIL Internal · Hamleys Team 4 · Unauthorised access prohibited</div>
  </div>
</div>
<div id="app">
  <header class="hdr">
    <div class="hl"><span>Hamleys</span><div class="hsep"></div><span class="hsub">ECOM INTELLIGENCE</span></div>
    <div class="hr">
      <span class="hmeta" id="hdr-d">No data</span>
      <span class="huser" id="hdr-u">—</span>
      <button class="hlout" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <!-- CHANNEL SELECTOR -->
  <div class="ch-bar" id="ch-bar">
    <button class="ch-btn on" data-ch="all">All Channels</button>
    <button class="ch-btn" data-ch="hm">hamleys.in</button>
    <button class="ch-btn" data-ch="ajio">AJIO</button>
    <button class="ch-btn" data-ch="amazon">Amazon</button>
    <button class="ch-btn" data-ch="flipkart">Flipkart</button>
    <button class="ch-btn" data-ch="jiomart">Jiomart</button>
    <span class="ch-meta" id="ch-meta">Select a channel to filter all tabs</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="targets">Targets</button>
    <button class="tab" data-tab="overview">Overview</button>
    <button class="tab" data-tab="channels">Channels</button>
    <button class="tab" data-tab="brands">Brands</button>
    <button class="tab" data-tab="categories">Categories</button>
    <button class="tab" data-tab="sellers">Top Sellers</button>
    <button class="tab" data-tab="discounts">Discounts</button>
    <button class="tab" data-tab="stores">Stores</button>
    <button class="tab" data-tab="catalog">Catalog</button>
    <button class="tab" data-tab="verify">Verify Data</button>
    <button class="tab" id="t-up" data-tab="upload" style="display:none">↑ Upload</button>
    <button class="tab" id="t-ad" data-tab="admin" style="display:none">⚙ Admin</button>
  </nav>
  <main class="main" id="content"></main>
  <footer>
    <span>Hamleys eCommerce Intelligence · Team 4 · <span id="ftr-d">—</span></span>
    <span>RIL Confidential · <span id="ftr-r">No data</span></span>
  </footer>
</div>
<div id="toast"></div>
<script>
// AUTH
const SALT="hamleys_ril_2026";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+SALT));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}
let USERS=[
  {username:"sneha",       hash:"fa96271dc9703018df737c14c66ba1c9e7c6254b81a7d089bc999551feca3e90",name:"Sneha",        role:"admin"},
  {username:"kanisht",     hash:"0e5045b1e7e3d347b9232b6d03b3c355b7cf952cbe1b7e2cc66376a1ae048701",name:"Kanisht",      role:"admin"},
  {username:"sunil",       hash:"14f591b15d82aab030d2bbbce273c10e40af45411de96607aab0bee89fd9278c",name:"Sunil",        role:"editor"},
  {username:"suruchi",     hash:"ebcb25bb5713b5fc962b02b1dc780f0857e76fdc5349fa1f348f7fbd7c3c343c",name:"Suruchi",      role:"editor"},
  {username:"vaibhavshree",hash:"37cb682a84e81eeb4e18a15bd257f5d2e63c4e4429b2aa85fc67120ba8fea333",name:"Vaibhavshree", role:"editor"},
];
let CU=null,AT="targets",CHANNEL="all";
async function initUsers(){try{const s=localStorage.getItem("hm_users3");if(s)USERS=JSON.parse(s);}catch(e){}}
async function doLogin(){
  const u=document.getElementById("liu").value.trim().toLowerCase();
  const p=document.getElementById("lip").value;
  const h=await sha(p);
  const f=USERS.find(x=>x.username===u&&x.hash===h);
  if(!f){document.getElementById("lerr").style.display="block";document.getElementById("lip").value="";return;}
  CU=f;localStorage.setItem("hm_sess4",JSON.stringify({u:f.username,ts:Date.now()}));showApp();
}
function doLogout(){CU=null;localStorage.removeItem("hm_sess4");document.getElementById("app").style.display="none";document.getElementById("ls").style.display="flex";document.getElementById("lip").value="";document.getElementById("liu").value="";document.getElementById("lerr").style.display="none";}
async function checkSess(){try{const s=JSON.parse(localStorage.getItem("hm_sess4")||"null");if(!s||Date.now()-s.ts>8*3600000){localStorage.removeItem("hm_sess4");return false;}const f=USERS.find(x=>x.username===s.u);if(!f)return false;CU=f;return true;}catch(e){return false;}}
function showApp(){document.getElementById("ls").style.display="none";document.getElementById("app").style.display="block";document.getElementById("hdr-u").textContent=CU.name+" · "+CU.role.toUpperCase();const ed=CU.role==="admin"||CU.role==="editor";document.getElementById("t-up").style.display=ed?"":"none";document.getElementById("t-ad").style.display=CU.role==="admin"?"":"none";updateHdr();render();}

// HELPERS
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const toISO=v=>{if(!v&&v!==0)return null;if(v instanceof Date)return v.toISOString().split("T")[0];const d=new Date(Date.UTC(1899,11,30));d.setUTCDate(d.getUTCDate()+Math.floor(+v));return d.toISOString().split("T")[0];};
const toN=v=>{if(!v&&v!==0)return 0;const s=String(v).trim();if(s==="-"||s==="")return 0;const n=parseFloat(s);return isNaN(n)?0:n;};
const fL=v=>`₹${(v/1e5).toFixed(2)}L`;
const fCr=v=>`₹${(v/1e7).toFixed(2)}Cr`;
const fN=v=>Math.round(+v).toLocaleString("en-IN");
const fP=v=>`${(+v).toFixed(1)}%`;
const fX=v=>`${(+v).toFixed(2)}x`;
const chg=(a,b)=>b&&b!==0?(a-b)/Math.abs(b)*100:null;
const bet=(d,s,e)=>!!d&&d>=s&&d<=e;
const cl=v=>Math.max(0,Math.min(100,v));
function bdg(v,inv=false){if(v===null||v===undefined)return`<span style="color:#bbb;font-size:10px">—</span>`;const ok=inv?v<=0:v>=0;return`<span class="${ok?"bup":"bdn"}">${v>=0?"+":""}${v.toFixed(1)}%</span>`;}
function fmtDate(iso){if(!iso)return"—";const[y,m,d]=iso.split("-");return`${+d} ${MON[+m-1]} ${y}`;}

// PERIODS
function getPeriods(mx){
  if(!mx)return null;
  const D=new Date(mx+"T00:00:00Z");
  const y=D.getUTCFullYear(),m=D.getUTCMonth(),d=D.getUTCDate();
  const s=(yr,mo,dy)=>new Date(Date.UTC(yr,mo,Math.max(1,Math.min(31,dy)))).toISOString().split("T")[0];
  const dow=D.getUTCDay(),db=dow===0?6:dow-1;
  return{mtdS:s(y,m,1),mtdE:s(y,m,d),pmS:s(y,m-1,1),pmE:s(y,m-1,d),lylS:s(y-1,m,1),lylE:s(y-1,m,d),wtdS:s(y,m,d-db),wtdE:s(y,m,d),pwS:s(y,m,d-db-7),pwE:s(y,m,d-7),d,month:MON[m],prevMonth:MON[(m+11)%12],year:y,monthNum:m+1,label:`${d} ${MON[m]} ${y}`};
}

// XLSB PATCHER — strips records that crash SheetJS 0.18.5
const SKIP_REC=new Set([0x3b,0x23f,0x240,0x241,0x242,0x4a,0x4b,0x239,0x23a,0x23b,0x23c,0x23d,0x23e]);
function patchXlsb(buf){
  const src=new Uint8Array(buf),out=new Uint8Array(src.length);
  let si=0,oi=0;
  while(si<src.length-1){
    let rt=src[si],tl=1;
    if(rt&0x80){if(si+1>=src.length)break;rt=(rt&0x7F)|(src[si+1]<<7);tl=2;}
    let rs=0,sl=0;
    for(let j=0;j<4;j++){const idx=si+tl+j;if(idx>=src.length)break;const b=src[idx];rs|=(b&0x7F)<<(7*j);sl++;if(!(b&0x80))break;}
    const rec=tl+sl+rs;
    if(SKIP_REC.has(rt)){si+=rec;}
    else{const e=Math.min(si+rec,src.length);out.set(src.subarray(si,e),oi);oi+=e-si;si+=rec;}
  }
  return out.buffer.slice(0,oi);

async function readWb(buf){
  const base={type:"array",raw:true,cellDates:false,WTF:false,cellStyles:false,bookVBA:false};
  const attempts=[
    ()=>XLSX.read(new Uint8Array(patchXlsb(buf)),base),
    ()=>XLSX.read(new Uint8Array(patchXlsb(buf)),{...base,dense:true}),
    ()=>XLSX.read(new Uint8Array(buf),base),

// HEADER DETECTION
function findHeaderRow(rows,signals=["tag","booking rev","orders","platform","store","article"]){
  for(let i=0;i<Math.min(8,rows.length);i++){
    const r=rows[i];if(!r)continue;
    const flat=r.map(v=>String(v||"").toLowerCase());
    if(signals.filter(s=>flat.some(f=>f.includes(s))).length>=2)return i;
  }
  return 0;
}
function buildColMap(hdr){
  const m={};
  (hdr||[]).forEach((v,i)=>{
    if(!v)return;
    const k=String(v).toLowerCase().trim().replace(/[\n\r\s]+/g," ").replace(/[^a-z0-9 %]/g,"").trim();
    m[k]=i;
    if(k.length>3)m[k.substring(0,18)]=i;
  });
  return m;
}
function col(map,...keys){
  for(const k of keys){
    const kl=k.toLowerCase().replace(/[^a-z0-9 %]/g,"").trim();
    if(map[kl]!==undefined)return map[kl];
    const found=Object.keys(map).find(mk=>mk===kl||mk.includes(kl)||kl.includes(mk));
    if(found!==undefined)return map[found];
  }
  return -1;
}

const CATMAP={LEGO:"Construction","Hot Wheels":"Action Toys",Matchbox:"Action Toys",Ralleyz:"Action Toys",Nerf:"Action Toys",Hamleys:"Lifestyle",Smiggle:"Lifestyle",Zoozi:"Lifestyle",Barbie:"Dolls & Roleplay","Disney Princess":"Dolls & Roleplay",EMotorad:"Rideons",Fuzzbuzz:"Plush",Rowan:"Plush","Jeannie Magic":"Plush",Youreka:"Games & Puzzles",MARVEL:"Games & Puzzles",Miko:"Games & Puzzles",Mirada:"Art & Craft",ELC:"Preschool",Giggles:"Preschool","Soft Buddies":"Plush",Beados:"Art & Craft"};

function parseDSRSheet(wb,sheetName){
  const sh=wb.Sheets[sheetName];if(!sh)return{recs:[],colMap:{}};
  const raw=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  const hi=findHeaderRow(raw,["tag","booking rev","orders","platform","mrp"]);
  const hdr=raw[hi]||[];
  const C=buildColMap(hdr);
  const dateCol=col(C,"start date","date");
  const tagCol=col(C,"tag","type");
  const colDefs={
    rev:           col(C,"booking rev","booking revenue","revenue"),
    mrp:           col(C,"booking mrp","mrp","gross mrp"),
    net:           col(C,"net rev","nsv","net sales","gsv"),
    orders:        col(C,"book orders","booking orders","orders"),
    units:         col(C,"units"),
    disc_pct:      col(C,"disc","total disc","total discount","discount"),
    cancel_pct:    col(C,"total cancel order","cancel order","cancel"),
    fill_rate:     col(C,"fill rate"),
    spends:        col(C,"spends"),
    fb_spends:     col(C,"fb spends","facebook"),
    google_spends: col(C,"google spends"),
    roas:          col(C,"roas"),
    target:        col(C,"booking target"),
    target_gross:  col(C,"target"),
    prepaid_pct:   col(C,"prepaid"),
    ga4_sessions:  col(C,"ga4 sessions","ga sessions"),
    aov:           col(C,"aov"),
  };
  const recs=[];
  for(let i=hi+1;i<raw.length;i++){
    const r=raw[i];if(!r)continue;
    const tag=String(r[tagCol]||"").toLowerCase();
    if(!tag.includes("daily"))continue;
    const date=toISO(r[dateCol]);if(!date)continue;
    const rec={date};
    for(const[k,c]of Object.entries(colDefs)){rec[k]=c>=0?toN(r[c]):0;}
    recs.push(rec);
  }
  const dates=recs.map(r=>r.date).sort();
  return{recs,colMap:colDefs,headerRow:hdr,minDate:dates[0]||null,maxDate:dates[dates.length-1]||null};
}

// TARGETS — 100% from DSR, nothing hardcoded, nothing from localStorage
function getTargets(P,dsr){
  if(!P||!dsr)return{booked:null,gross:null,total:null,src:{booked:"Upload DSR",gross:"Upload DSR",total:"Upload DSR"}};
  const mk=`${P.year}-${String(P.monthNum).padStart(2,"0")}`;
  const msum=(recs,field)=>(recs||[]).filter(r=>r.date.startsWith(mk)).reduce((s,r)=>s+(r[field]||0),0);
  const mdays=(recs)=>(recs||[]).filter(r=>r.date.startsWith(mk)).length;
  const booked  = msum(dsr.hm?.recs,   "target");
  const gross   = msum(dsr.hm?.recs,   "target_gross");
  const ajioTgt = msum(dsr.ajio?.recs, "target");
  const amTgt   = msum(dsr.amazon?.recs,"target");
  const fkTgt   = msum(dsr.flipkart?.recs,"target");
  const jmTgt   = msum(dsr.jiomart?.recs,"target");
  const total   = (booked||0)+(ajioTgt||0)+(amTgt||0)+(fkTgt||0)+(jmTgt||0);
  return{
    booked:booked||null, gross:gross||null, total:total||null,
    ajio:ajioTgt||null, amazon:amTgt||null, flipkart:fkTgt||null, jiomart:jmTgt||null,
    src:{booked:booked?`DSR Booking Target · ${mk} · ${mdays(dsr.hm?.recs)}d`:"Upload DSR",gross:gross?`DSR Target col · ${mk}`:"Upload DSR",total:total?`DSR all channels · ${mk}`:"Upload DSR"}
  };
}

function agg(recs,s,e,keys){const f=recs.filter(r=>bet(r.date,s,e));const o={n:f.length};for(const k of keys)o[k]=f.reduce((a,r)=>a+(r[k]||0),0);return o;}
function avgK(recs,s,e,k){const f=recs.filter(r=>bet(r.date,s,e));return f.length?f.reduce((a,r)=>a+(r[k]||0),0)/f.length:0;}

  {id:"fynd_dump",    label:"Fynd Dump",            hint:"Fynd_Products_*.xlsx",        icon:"📚",cols:"Auto-detects: Article · Brand · Category · Is_live"},
  {id:"soh_file",     label:"SOH File",             hint:"SOH_*.xlsx",                 icon:"📦",cols:"Auto-detects: Article · SOH quantity"},
  {id:"master_file",  label:"Master Catalog",       hint:"Master_File_*.xlsx",         icon:"📋",cols:"Auto-detects: Article · Brand · Category · MRP · Is_active"},
];
function saveData(){try{localStorage.setItem("hm_fd6",JSON.stringify(FD));localStorage.setItem("hm_st6",JSON.stringify(US));}catch(e){}}
function loadData(){try{const f=localStorage.getItem("hm_fd6");if(f){FD=JSON.parse(f);M=compute(FD);}const s=localStorage.getItem("hm_st6");if(s)US=JSON.parse(s);}catch(e){}}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",3500);}
function updateHdr(){
  if(!M)return;
  document.getElementById("hdr-d").textContent=`Data: ${fmtDate(M.maxDate)} · ${M.P.month} ${M.P.year}`;
  document.getElementById("ftr-d").textContent=fmtDate(M.maxDate);
  const tot=Object.values(FD).reduce((s,f)=>s+(typeof f?.rows==="number"?f.rows:0),0);
  document.getElementById("ftr-r").textContent=`${tot.toLocaleString()} rows`;
  const chD=getChData(M);
  document.getElementById("ch-meta").textContent=`${chD?.label||"All"}  ·  ${M.P.month} MTD: ${M.summary.bookedM>0?fL(CHANNEL==="all"?M.summary.totalM:chD?.d?.M?.rev||0):"—"}`;
}
async function handleFile(fid,file){
  if(!file)return;
  US[fid]={name:file.name,parsing:true};render();
  try{
    const buf=await file.arrayBuffer();
    const wb=await readWb(buf);
    let parsed=null;
    if(fid==="sales_dump")        parsed=parseDump(wb);
    else if(fid==="dsr")          parsed=parseDSR(wb);
    else if(fid==="campaign")     parsed=parseCamp(wb);
    else if(fid==="store_tracker")parsed=parseStoreTracker(wb);
    else if(["fynd_dump","soh_file","master_file"].includes(fid))parsed=parseCatalogSheet(wb);
    else parsed={raw:true,rows:0};
    FD[fid]=parsed;M=compute(FD);
    const dr=parsed?.minDate&&parsed?.maxDate?`${fmtDate(parsed.minDate)} → ${fmtDate(parsed.maxDate)}`:"";
    US[fid]={name:file.name,rows:parsed?.rows||0,done:true,ts:new Date().toLocaleTimeString(),by:CU.name,dateRange:dr};
    saveData();updateHdr();showToast(`✓ ${file.name}${dr?" · "+dr:""} · ${(parsed?.rows||0).toLocaleString()} rows`);
  }catch(err){US[fid]={name:file.name,error:String(err).slice(0,200)};showToast("Error: "+String(err).slice(0,100));}
  render();
}

// RENDER HELPERS
function th(hs){return`<tr>${hs.map((h,i)=>`<th class="${i>0?"r":""}">${h}</th>`).join("")}</tr>`;}
function td(vs,cls=""){return`<tr${cls?` class="${cls}`+'"':""}>${vs.map((v,i)=>`<td class="${i>0?"r":""}">${v}</td>`).join("")}</tr>`;}
function kpi(l,v,pv,b,pvL,ex,tgt){return`<div class="kc"><div class="kl">${l}</div><div class="kv">${v}</div>${pv?`<div class="kr">${b!==null&&b!==undefined?bdg(b):""}<span class="kp">${pvL||"prev"}: ${pv}</span></div>`:""}${ex?`<div class="ke">${ex}</div>`:""}${tgt?`<div style="margin-top:5px"><div style="display:flex;justify-content:space-between;font-size:9px;color:#bbb;margin-bottom:2px"><span>${tgt.l}</span><span>${cl(tgt.p).toFixed(0)}%</span></div><div style="background:var(--acc);height:3px;border-radius:2px;overflow:hidden"><div style="height:100%;width:${cl(tgt.p)}%;background:${tgt.p>=100?"var(--grn)":tgt.p>=80?"var(--amb)":"var(--red)"};transition:width .8s"></div></div></div>`:""}</div>`;}

function tgtCard(lbl,ach,tgt,proj,src){
  if(!tgt)return`<div class="tc"><div class="tl">${lbl}</div><div class="al al-a" style="margin:8px 0;font-size:10px">Target not in DSR file for this channel / month</div><div style="font-size:11px">Achieved: <strong>${fCr(ach)}</strong> &nbsp; Projected: <strong>${fCr(proj)}</strong></div></div>`;
  const p=tgt>0?ach/tgt*100:0,pp=tgt>0?proj/tgt*100:0;
  const ok=p>=100,wn=p>=80;const col=ok?"var(--grn)":wn?"var(--amb)":"var(--red)";
  return`<div class="tc"><div class="tl">${lbl}</div><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><span class="tv" style="color:${col}">${fCr(ach)}</span><span style="font-size:10px;color:#bbb">/ ${fCr(tgt)}</span><span style="margin-left:auto;background:${ok?"var(--gbg)":wn?"#fff8e1":"var(--ebg)"};color:${col};font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px">${p.toFixed(1)}% ${ok?"✓ Beat":wn?"On Track":"At Risk"}</span></div><div class="tbar"><div class="tfill" style="width:${cl(p)}%;background:${col}"></div></div><div class="tn"><span>Gap: <strong>${fCr(Math.max(0,tgt-ach))}</strong></span><span>Proj: <strong style="color:${pp>=100?"var(--grn)":"var(--red)"}">${fCr(proj)}</strong></span></div><div style="font-size:9px;color:#bbb;margin-top:3px;font-family:var(--mono)">${src||""}</div></div>`;
}
function noData(msg){return`<div style="text-align:center;padding:55px 20px"><div style="font-family:var(--disp);font-size:40px;color:var(--acc);letter-spacing:.1em">NO DATA</div><div style="font-size:12px;margin:7px 0 13px;color:#999">${msg||"Upload files to load metrics"}</div>${CU?.role!=="viewer"?`<button onclick="switchTab('upload')" style="background:var(--red);color:#fff;border:none;padding:8px 18px;border-radius:var(--r);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer">Upload Files →</button>`:""}</div>`;}
function discH(l,v,pv,pvL,inv=false){const c=v>35?"var(--red)":v>25?"var(--amb)":"var(--blk)";return`<div class="dh"><div class="dhl">${l}</div><div class="dhv" style="color:${c}">${fP(v)}</div><div style="display:flex;gap:4px;align-items:center">${bdg(chg(v,pv),inv)}<span style="font-size:9px;color:#bbb">${pvL}: ${fP(pv)}</span></div></div>`;}

// TAB: STORES
function tabStores(){
  const st=FD.store_tracker;
  if(!st)return`<div class="al al-a">Upload Store Live Tracker file to see store data. Go to ↑ Upload tab.</div>`;
  const recs=st.recs||[];
  if(!recs.length)return`<div class="al al-r">Store tracker file uploaded but no rows detected. Check column headers.</div>`;
  const totalLive=recs.reduce((s,r)=>s+r.live_skus,0);
  const totalOrders=recs.reduce((s,r)=>s+r.orders,0);
  const totalRev=recs.reduce((s,r)=>s+r.revenue,0);
  const avgFill=recs.filter(r=>r.fill_rate>0).length?recs.filter(r=>r.fill_rate>0).reduce((s,r)=>s+r.fill_rate,0)/recs.filter(r=>r.fill_rate>0).length:0;
  const avgCan=recs.filter(r=>r.cancel_pct>0).length?recs.filter(r=>r.cancel_pct>0).reduce((s,r)=>s+r.cancel_pct,0)/recs.filter(r=>r.cancel_pct>0).length:0;
  const sorted=[...recs].sort((a,b)=>b.revenue||b.orders||b.live_skus-(a.revenue||a.orders||a.live_skus));
  const maxFill=Math.max(...recs.map(r=>r.fill_rate||0),1);
  return`<div class="sec">
    <div class="sh"><span class="sn">ST</span><span class="st">Store Live Tracker</span><span class="ss">${recs.length} stores · from ${US.store_tracker?.dateRange||"uploaded file"}</span></div>
    <div class="kg">
      ${kpi("Total Stores",fN(recs.length))}
      ${kpi("Total Live SKUs",fN(totalLive))}
      ${kpi("Total Orders",fN(totalOrders))}
      ${totalRev>0?kpi("Total Revenue",fL(totalRev)):""}
      ${avgFill>0?kpi("Avg Fill Rate",fP(avgFill>1?avgFill:avgFill*100)):""}
      ${avgCan>0?kpi("Avg Cancel %",fP(avgCan>1?avgCan:avgCan*100)):""}
    </div>
    <div class="sh"><span class="sn">↳</span><span class="st">Store-Level Detail</span></div>
    <div class="tw"><table>
      <thead>${th(["Store","City","Live SKUs","Orders","Revenue","Fill Rate","Cancel %"])}</thead>
      <tbody>
        ${sorted.map(r=>{
          const fr=r.fill_rate>1?r.fill_rate:r.fill_rate*100;
          const cp=r.cancel_pct>1?r.cancel_pct:r.cancel_pct*100;
          const frColor=fr>0?(fr>=95?"var(--grn)":fr>=85?"var(--amb)":"var(--red)"):"#bbb";
          const cpColor=cp>0?(cp<=5?"var(--grn)":cp<=15?"var(--amb)":"var(--red)"):"#bbb";
          return td([r.name||(r.code||"—"),r.city||"—",r.live_skus>0?fN(r.live_skus):"—",r.orders>0?fN(r.orders):"—",r.revenue>0?fL(r.revenue):"—",fr>0?`<span style="color:${frColor};font-family:var(--mono)">${fP(fr)}</span>`:"—",cp>0?`<span style="color:${cpColor};font-family:var(--mono)">${fP(cp)}</span>`:"—"]);
        }).join("")}
      </tbody>
    </table></div>
    ${recs.some(r=>r.fill_rate>0)?`<div class="sh" style="margin-top:12px"><span class="sn">↳</span><span class="st">Fill Rate — Store Comparison</span></div>
    <div class="cd">${sorted.filter(r=>r.fill_rate>0).sort((a,b)=>a.fill_rate-b.fill_rate).slice(0,20).map(r=>{const fr=r.fill_rate>1?r.fill_rate:r.fill_rate*100;const c=fr>=95?"var(--grn)":fr>=85?"var(--amb)":"var(--red)";return`<div class="fbar-row"><span class="fbar-lbl">${r.name||r.code}</span><div class="fbar-bg"><div class="fbar-fill" style="width:${fr}%;background:${c}"></div></div><span class="fbar-val" style="color:${c}">${fP(fr)}</span></div>`;}).join("")}</div>`:``}
  </div>`;
}

// TAB: CATALOG
function tabCatalog(){
  const hasFynd=!!FD.fynd_dump,hasSOH=!!FD.soh_file,hasMaster=!!FD.master_file;
  if(!hasFynd&&!hasMaster)return`<div class="al al-a">Upload Fynd Dump and/or Master Catalog to enable this tab. Go to ↑ Upload.</div>`;
  const fyndMap={};if(FD.fynd_dump)FD.fynd_dump.recs.forEach(r=>fyndMap[r.article]=r);
  const sohMap={};if(FD.soh_file)FD.soh_file.recs.forEach(r=>sohMap[r.article]=(sohMap[r.article]||0)+r.soh);
  const masterMap={};if(FD.master_file)FD.master_file.recs.forEach(r=>masterMap[r.article]=r);
  const allArts=[...new Set([...Object.keys(masterMap),...Object.keys(fyndMap)])];
  const rows=allArts.map(a=>({article:a,desc:(masterMap[a]?.desc||fyndMap[a]?.desc||"").slice(0,50),brand:masterMap[a]?.brand||fyndMap[a]?.brand||"",category:masterMap[a]?.category||fyndMap[a]?.category||"",mrp:masterMap[a]?.mrp||fyndMap[a]?.mrp||0,inMaster:!!masterMap[a],activeMaster:masterMap[a]?.is_active||false,inFynd:!!fyndMap[a],liveFynd:fyndMap[a]?.is_live||false,soh:sohMap[a]||0}));
  const live=rows.filter(r=>r.liveFynd).length;
  const sohNotLive=rows.filter(r=>r.soh>0&&!r.liveFynd).sort((a,b)=>b.soh-a.soh);
  const liveNoSOH=rows.filter(r=>r.liveFynd&&r.soh===0);
  return`<div class="sec"><div class="sh"><span class="sn">CT</span><span class="st">Catalog Health</span><span class="ss">${[hasMaster?"Master ✓":"Master —",hasFynd?"Fynd ✓":"Fynd —",hasSOH?"SOH ✓":"SOH —"].join(" · ")}</span></div><div class="kg">${kpi("Total (Master)",fN(Object.keys(masterMap).length))}${kpi("Active hamleys.in",fN(rows.filter(r=>r.activeMaster).length))}${kpi("Live on Fynd",fN(live))}${kpi("SOH>0 not live",fN(sohNotLive.length),"","","","Launch opportunity")}${kpi("Live zero SOH",fN(liveNoSOH.length),"","","","Cancellation risk")}</div>${sohNotLive.length>0?`<div class="sh" style="margin-top:6px"><span class="sn">↳</span><span class="st">Launch Opportunity — top 30</span></div><div class="tw"><table><thead>${th(["Article","Description","Brand","Category","MRP","SOH"])}</thead><tbody>${sohNotLive.slice(0,30).map(r=>td([`<span style="font-family:var(--mono);font-size:10px">${r.article}</span>`,r.desc,r.brand,r.category,r.mrp>0?`₹${fN(r.mrp)}`:"—",fN(r.soh)])).join("")}</tbody></table></div>`:``}${liveNoSOH.length>0?`<div class="sh" style="margin-top:6px"><span class="sn">↳</span><span class="st">Cancellation Risk — top 20</span></div><div class="tw"><table><thead>${th(["Article","Description","Brand","Category","MRP"])}</thead><tbody>${liveNoSOH.slice(0,20).map(r=>td([`<span style="font-family:var(--mono);font-size:10px">${r.article}</span>`,r.desc,r.brand,r.category,r.mrp>0?`₹${fN(r.mrp)}`:"—"])).join("")}</tbody></table></div>`:``}</div>`;
}

// TAB: VERIFY
function tabVerify(){
  const dsr=FD.dsr,sd=FD.sales_dump;
  if(!dsr&&!sd)return`<div class="al al-r">Upload DSR and/or Sales Dump first.</div>`;
  const P=M?.P;
  let html=`<div class="sec"><div class="sh"><span class="sn">✓</span><span class="st">Data Verification</span><span class="ss">Cross-check exactly what was parsed vs your source file</span></div>`;
  if(dsr){
    const hmRecs=dsr.hm?.recs||[];
    const mk=P?`${P.year}-${String(P.monthNum).padStart(2,"0")}`:"";
    const mRecs=hmRecs.filter(r=>r.date.startsWith(mk));
    html+=`<div class="sh"><span class="sn">DSR</span><span class="st">DSR — hamleys.in</span><span class="ss">Sheets: ${Object.entries(dsr.sheetsFound||{}).filter(([,v])=>v).map(([,v])=>v).join(" · ")||"—"}</span></div>`;
    html+=`<div class="g2" style="margin-bottom:12px"><div class="cd"><div class="ct">Columns detected (header-based)</div>`;
    if(dsr.hm?.colMap)Object.entries(dsr.hm.colMap).forEach(([k,v])=>{html+=`<div class="vrow"><span class="vlbl">${k}</span><span class="vval" style="color:${v>=0?"inherit":"var(--err)"}">${v>=0?"col "+v:"NOT FOUND"}</span></div>`;});
    html+=`</div><div class="cd"><div class="ct">${P?.month||"Current"} ${P?.year||""} (${mRecs.length} days with data)</div>`;
    if(mRecs.length){
      const s=(k)=>mRecs.reduce((a,r)=>a+(r[k]||0),0);
      html+=`<div class="vrow"><span class="vlbl">Booking Revenue</span><span><span class="vval">${fCr(s("rev"))}</span> <span class="vsrc">${mRecs.length}d actual</span></span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Booking Target (col "Booking Target")</span><span><span class="vval" style="color:var(--grn)">${fCr(s("target"))}</span> <span class="vsrc">full month sum · from file</span></span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Gross MRP Target (col "Target")</span><span><span class="vval" style="color:var(--grn)">${fCr(s("target_gross"))}</span> <span class="vsrc">full month sum · from file</span></span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Orders</span><span class="vval">${fN(s("orders"))}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Total Spends</span><span class="vval">${fL(s("spends"))}</span></div>`;
      html+=`<div class="vrow" style="border:none"><span class="vlbl">Cancel % (avg daily)</span><span class="vval">${fP(mRecs.reduce((a,r)=>a+r.cancel_pct,0)/mRecs.length*100)}</span></div>`;
      html+=`<div class="sh" style="margin-top:10px"><span class="sn">↳</span><span class="st">Last 5 rows parsed</span></div><div class="tw"><table><thead>${th(["Date","Orders","Rev","Target","Spends","Cancel%"])}</thead><tbody>${mRecs.slice(0,5).map(r=>td([r.date,fN(r.orders),fL(r.rev),fL(r.target),fL(r.spends),fP(r.cancel_pct*100)])).join("")}</tbody></table></div>`;
    }else{html+=`<div style="color:#999;font-size:11px;padding:10px 0">No rows found for ${P?.month||"current month"}. DSR may not have data yet for this period.</div>`;}
    html+=`</div></div>`;
  }
  if(sd){
    const P2=M?.P;
    const mk=P2?`${P2.year}-${String(P2.monthNum).padStart(2,"0")}`:"";
    const mRecs=sd.recs.filter(r=>r.date.startsWith(mk));
    html+=`<div class="sh" style="margin-top:8px"><span class="sn">DUMP</span><span class="st">Sales Dump</span><span class="ss">${fmtDate(sd.minDate)} → ${fmtDate(sd.maxDate)} · ${sd.rows.toLocaleString()} rows</span></div>`;
    html+=`<div class="g2"><div class="cd"><div class="ct">Columns detected</div>`;
    if(sd.colsDetected)Object.entries(sd.colsDetected).forEach(([k,v])=>{html+=`<div class="vrow"><span class="vlbl">${k}</span><span class="vval" style="color:${v>=0?"inherit":"var(--err)"}">${v>=0?"col "+v:"NOT FOUND"}</span></div>`;});
    html+=`</div><div class="cd"><div class="ct">${P2?.month||"Current"} Summary (${mRecs.length} rows)</div>`;
    if(mRecs.length){
      const rev=mRecs.reduce((s,r)=>s+r.rev,0),gross=mRecs.reduce((s,r)=>s+r.gross,0),disc=mRecs.reduce((s,r)=>s+r.total_d,0);
      html+=`<div class="vrow"><span class="vlbl">Booked Revenue</span><span class="vval">${fL(rev)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Gross MRP</span><span class="vval">${fL(gross)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Total Discount</span><span class="vval">${fL(disc)} (${gross>0?fP(disc/gross*100):"—"})</span></div>`;
      html+=`<div class="vrow" style="border:none"><span class="vlbl">Brands found</span><span class="vval">${[...new Set(mRecs.map(r=>r.brand))].filter(Boolean).length}</span></div>`;
    }else{html+=`<div style="color:#999;font-size:11px">No rows for ${P2?.month||"current month"} in Sales Dump.</div>`;}
    html+=`</div></div>`;
  }
  html+=`</div>`;return html;
}

// ADMIN ACTIONS
async function addUser(){const n=document.getElementById("nu-n").value.trim();const u=document.getElementById("nu-u").value.trim().toLowerCase();const p=document.getElementById("nu-p").value;const r=document.getElementById("nu-r").value;if(!n||!u||!p){showToast("Fill all fields");return;}const h=await sha(p);const idx=USERS.findIndex(x=>x.username===u);if(idx>=0)USERS[idx]={username:u,name:n,hash:h,role:r};else USERS.push({username:u,name:n,hash:h,role:r});localStorage.setItem("hm_users3",JSON.stringify(USERS));showToast(`✓ ${n} (${r}) saved`);render();}
function delUser(u){if(!confirm(`Remove ${u}?`))return;USERS=USERS.filter(x=>x.username!==u);localStorage.setItem("hm_users3",JSON.stringify(USERS));showToast(`${u} removed`);render();}
function clearAll(){if(!confirm("Clear all uploaded data?"))return;FD={};US={};M=null;localStorage.removeItem("hm_fd6");localStorage.removeItem("hm_st6");document.getElementById("hdr-d").textContent="No data";document.getElementById("ftr-d").textContent="—";document.getElementById("ftr-r").textContent="No data";render();showToast("Cleared");}

// RENDER
function render(){
  const map={targets:tabTargets,overview:tabOverview,channels:tabChannels,brands:tabBrands,categories:tabCategories,sellers:tabSellers,discounts:tabDiscounts,stores:tabStores,catalog:tabCatalog,verify:tabVerify,upload:tabUpload,admin:tabAdmin};
  document.getElementById("content").innerHTML=(map[AT]||tabTargets)();
  FDEFS.forEach(f=>{const dz=document.getElementById(`dz-${f.id}`);if(!dz)return;dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("dg");});dz.addEventListener("dragleave",()=>dz.classList.remove("dg"));dz.addEventListener("drop",async e=>{e.preventDefault();dz.classList.remove("dg");const file=e.dataTransfer.files[0];if(file)await handleFile(f.id,file);});});
}
function switchTab(id){AT=id;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===id));render();}
document.getElementById("tabs").addEventListener("click",e=>{if(e.target.dataset.tab)switchTab(e.target.dataset.tab);});
// Channel selector
document.getElementById("ch-bar").addEventListener("click",e=>{
  if(!e.target.dataset.ch)return;
  CHANNEL=e.target.dataset.ch;
  document.querySelectorAll(".ch-btn").forEach(b=>b.classList.toggle("on",b.dataset.ch===CHANNEL));
  updateHdr();render();
});

// INIT
(async()=>{await initUsers();loadData();if(await checkSess())showApp();else document.getElementById("liu").focus();})();
</script>
</body>
