<!DOCTYPE html>
<html lang="en">
<head>

<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--blk);font-family:var(--sans);font-size:13px}
#ls{position:fixed;inset:0;z-index:9999;background:var(--blk);display:flex;align-items:center;justify-content:center}
.lb{background:var(--crd);width:400px;border-radius:10px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.lh{background:var(--rdk);padding:26px 30px}
.ll{font-family:var(--disp);font-size:27px;letter-spacing:.12em;color:var(--wht)}
.ls2{font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.06em;font-family:var(--mono);margin-top:3px}
.lbd{padding:26px 30px}
.llab{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#666;margin-bottom:4px;display:block}
.lin{width:100%;padding:9px 11px;border:1px solid var(--div);border-radius:var(--r);font-family:var(--mono);font-size:12px;margin-bottom:12px;outline:none;background:var(--bg)}
.lin:focus{border-color:var(--red)}
.lbtn{width:100%;background:var(--red);color:var(--wht);border:none;padding:10px;border-radius:var(--r);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:3px}
.lbtn:hover{background:var(--rdk)}
.lerr{background:var(--ebg);border:1px solid var(--hi);color:var(--err);font-size:11px;padding:8px 11px;border-radius:var(--r);margin-top:10px;display:none;font-family:var(--mono)}
.lft{padding:12px 30px;background:#f9f9f9;border-top:1px solid var(--div);font-size:10px;color:#999;text-align:center;font-family:var(--mono)}

.hdr{background:var(--rdk);color:var(--wht);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(207,16,45,.3)}

.hlout:hover{background:rgba(255,255,255,.1)}
.tabs{background:var(--crd);border-bottom:1px solid var(--div);display:flex;padding:0 24px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#888;padding:11px 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.tab:hover:not(.on){color:var(--blk)}
.main{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
.sec{margin-bottom:26px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--div)}
.sn{font-family:var(--mono);font-size:9px;color:var(--red);background:var(--ebg);padding:1px 6px;border-radius:3px}
.st{font-family:var(--disp);font-size:16px;letter-spacing:.06em}
.ss{font-size:9px;color:#999;margin-left:auto;font-family:var(--mono)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:1px;background:var(--div);border:1px solid var(--div);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.kc{background:var(--crd);padding:13px 15px}

.kv{font-family:var(--disp);font-size:26px;color:var(--blk);line-height:1;margin-bottom:4px}
.kr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kp{font-family:var(--mono);font-size:9px;color:#bbb}
.ke{font-family:var(--mono);font-size:9px;color:var(--grn);margin-top:3px}
.bup{background:var(--gbg);color:var(--grn);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
.bdn{background:var(--ebg);color:var(--err);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}

table{width:100%;border-collapse:collapse;font-size:11px}

.gh-s{font-size:10px;color:#94a3b8;margin-bottom:13px}
.gh-g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ghs{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:10px 11px}

footer{background:var(--rdk);padding:11px 24px;display:flex;justify-content:space-between;margin-top:32px}

#toast{position:fixed;bottom:15px;right:15px;background:var(--blk);color:var(--wht);border-radius:var(--r);padding:9px 14px;font-size:11px;z-index:99999;border-left:3px solid var(--red);font-family:var(--mono);display:none;max-width:320px}
/* VERIFY */
.vrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--div)}
.vrow:last-child{border:none}
.vlbl{font-size:11px;color:#555}
.vval{font-family:var(--mono);font-size:12px;font-weight:500}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sec{animation:fadeUp .3s ease both}
</style>
</head>
<body>
<div id="ls">
  <div class="lb">
    <div class="lh"><div class="ll">Hamleys</div><div class="ls2">eCommerce Intelligence · Internal Use Only</div></div>
    <div class="lbd">
      <label class="llab">Username</label>
      <input id="liu" class="lin" type="text" placeholder="Enter username" autocomplete="username">
      <label class="llab">Password</label>
      <input id="lip" class="lin" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lbtn" onclick="doLogin()">Sign In →</button>
      <div class="lerr" id="lerr">Incorrect username or password.</div>
    </div>
    <div class="lft">RIL Internal · Hamleys Team 4 · Unauthorised access prohibited</div>
  </div>
</div>
<div id="app">
  <header class="hdr">
    <div class="hl"><span>Hamleys</span><div class="hsep"></div><span class="hsub">ECOM INTELLIGENCE</span></div>
    <div class="hr">
      <span class="hmeta" id="hdr-d">No data</span>
      <span class="huser" id="hdr-u">—</span>
      <button class="hlout" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="targets">Targets</button>
    <button class="tab" data-tab="overview">Overview</button>
    <button class="tab" data-tab="brands">Brands</button>
    <button class="tab" data-tab="categories">Categories</button>
    <button class="tab" data-tab="sellers">Top Sellers</button>
    <button class="tab" data-tab="discounts">Discounts</button>
    <button class="tab" data-tab="catalog">Catalog</button>
    <button class="tab" data-tab="verify">Verify Data</button>
    <button class="tab" id="t-up" data-tab="upload" style="display:none">↑ Upload</button>
    <button class="tab" id="t-ad" data-tab="admin" style="display:none">⚙ Admin</button>
  </nav>
  <main class="main" id="content"></main>
  <footer>
    <span>Hamleys eCommerce Intelligence · Team 4 · <span id="ftr-d">—</span></span>
    <span>RIL Confidential · <span id="ftr-r">No data</span></span>
  </footer>
</div>
<div id="toast"></div>
<script>
// ════════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════════
const SALT="hamleys_ril_2026";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+SALT));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
let USERS=[
  {username:"sneha",       hash:"fa96271dc9703018df737c14c66ba1c9e7c6254b81a7d089bc999551feca3e90",name:"Sneha",        role:"admin"},
  {username:"kanisht",     hash:"0e5045b1e7e3d347b9232b6d03b3c355b7cf952cbe1b7e2cc66376a1ae048701",name:"Kanisht",      role:"admin"},
  {username:"sunil",       hash:"14f591b15d82aab030d2bbbce273c10e40af45411de96607aab0bee89fd9278c",name:"Sunil",        role:"editor"},
  {username:"suruchi",     hash:"ebcb25bb5713b5fc962b02b1dc780f0857e76fdc5349fa1f348f7fbd7c3c343c",name:"Suruchi",      role:"editor"},
  {username:"vaibhavshree",hash:"37cb682a84e81eeb4e18a15bd257f5d2e63c4e4429b2aa85fc67120ba8fea333",name:"Vaibhavshree", role:"editor"},
];
let CU=null,AT="targets";
async function initUsers(){try{const s=localStorage.getItem("hm_users3");if(s)USERS=JSON.parse(s);}catch(e){}}
async function doLogin(){
  const u=document.getElementById("liu").value.trim().toLowerCase();
  const p=document.getElementById("lip").value;
  const h=await sha(p);
  const f=USERS.find(x=>x.username===u&&x.hash===h);
  if(!f){document.getElementById("lerr").style.display="block";document.getElementById("lip").value="";return;}
  CU=f;localStorage.setItem("hm_sess3",JSON.stringify({u:f.username,ts:Date.now()}));showApp();
}
function doLogout(){CU=null;localStorage.removeItem("hm_sess3");document.getElementById("app").style.display="none";document.getElementById("ls").style.display="flex";document.getElementById("lip").value="";document.getElementById("liu").value="";document.getElementById("lerr").style.display="none";}
async function checkSess(){try{const s=JSON.parse(localStorage.getItem("hm_sess3")||"null");if(!s||Date.now()-s.ts>8*3600000){localStorage.removeItem("hm_sess3");return false;}const f=USERS.find(x=>x.username===s.u);if(!f)return false;CU=f;return true;}catch(e){return false;}}
function showApp(){document.getElementById("ls").style.display="none";document.getElementById("app").style.display="block";document.getElementById("hdr-u").textContent=CU.name+" · "+CU.role.toUpperCase();const ed=CU.role==="admin"||CU.role==="editor";document.getElementById("t-up").style.display=ed?"":"none";document.getElementById("t-ad").style.display=CU.role==="admin"?"":"none";updateHdr();render();}

// ════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const toISO=v=>{if(!v&&v!==0)return null;if(v instanceof Date)return v.toISOString().split("T")[0];const d=new Date(Date.UTC(1899,11,30));d.setUTCDate(d.getUTCDate()+Math.floor(+v));return d.toISOString().split("T")[0];};
const toN=v=>{if(!v&&v!==0)return 0;const s=String(v).trim();if(s==='-'||s==='')return 0;const n=parseFloat(s);return isNaN(n)?0:n;};
const fL=v=>`₹${(v/1e5).toFixed(2)}L`;
const fCr=v=>`₹${(v/1e7).toFixed(2)}Cr`;
const fN=v=>Math.round(+v).toLocaleString("en-IN");
const fP=v=>`${(+v).toFixed(1)}%`;
const fX=v=>`${(+v).toFixed(2)}x`;
const chg=(a,b)=>b&&b!==0?(a-b)/Math.abs(b)*100:null;
const bet=(d,s,e)=>!!d&&d>=s&&d<=e;
const cl=v=>Math.max(0,Math.min(100,v));
function bdg(v,inv=false){if(v===null||v===undefined)return`<span style="color:#bbb;font-size:10px">—</span>`;const ok=inv?v<=0:v>=0;return`<span class="${ok?'bup':'bdn'}">${v>=0?"+":""}${v.toFixed(1)}%</span>`;}
function fmtDate(iso){if(!iso)return"—";const[y,m,d]=iso.split("-");return`${+d} ${MON[+m-1]} ${y}`;}

// ════════════════════════════════════════════════════════
// PERIODS
// ════════════════════════════════════════════════════════
function getPeriods(mx){
  if(!mx)return null;
  const D=new Date(mx+"T00:00:00Z");
  const y=D.getUTCFullYear(),m=D.getUTCMonth(),d=D.getUTCDate();
  const s=(yr,mo,dy)=>new Date(Date.UTC(yr,mo,Math.max(1,Math.min(31,dy)))).toISOString().split("T")[0];
  const dow=D.getUTCDay(),db=dow===0?6:dow-1;
  return{mtdS:s(y,m,1),mtdE:s(y,m,d),pmS:s(y,m-1,1),pmE:s(y,m-1,d),lylS:s(y-1,m,1),lylE:s(y-1,m,d),wtdS:s(y,m,d-db),wtdE:s(y,m,d),pwS:s(y,m,d-db-7),pwE:s(y,m,d-7),d,month:MON[m],prevMonth:MON[(m+11)%12],year:y,monthNum:m+1,label:`${d} ${MON[m]} ${y}`};
}

// ════════════════════════════════════════════════════════
// XLSB PATCHER
// ════════════════════════════════════════════════════════
const SKIP_REC=new Set([0x3b,0x23f,0x240,0x241,0x242,0x4a,0x4b]);
function patchXlsb(buf){
  const src=new Uint8Array(buf),out=new Uint8Array(src.length);
  let si=0,oi=0;
  while(si<src.length-1){
    let rt=src[si],tl=1;
    if(rt&0x80){if(si+1>=src.length)break;rt=(rt&0x7F)|(src[si+1]<<7);tl=2;}
    let rs=0,sl=0;
    for(let j=0;j<4;j++){const idx=si+tl+j;if(idx>=src.length)break;const b=src[idx];rs|=(b&0x7F)<<(7*j);sl++;if(!(b&0x80))break;}
    const rec=tl+sl+rs;
    if(SKIP_REC.has(rt)){si+=rec;}else{const e=Math.min(si+rec,src.length);out.set(src.subarray(si,e),oi);oi+=e-si;si+=rec;}
  }
  return out.buffer.slice(0,oi);
}
async function readWb(buf){
  const o={type:"array",raw:true,cellDates:false,WTF:false,cellStyles:false,bookVBA:false};
  for(const opts of[{...o},({...o,dense:true}),({...o,sheetRows:200000})]){
    try{return XLSX.read(new Uint8Array(patchXlsb(buf)),opts);}catch(e){}
    try{return XLSX.read(new Uint8Array(buf),opts);}catch(e){}
  }
  throw new Error("Cannot parse xlsb. Open in Excel → Save As → .xlsx → retry.");
}

// ════════════════════════════════════════════════════════
// HEADER-BASED COLUMN DETECTOR
// ════════════════════════════════════════════════════════
function findHeaderRow(rows,signals=['tag','booking rev','orders','platform']){
  for(let i=0;i<Math.min(6,rows.length);i++){
    const r=rows[i];if(!r)continue;
    const flat=r.map(v=>String(v||"").toLowerCase());
    if(signals.some(s=>flat.some(f=>f.includes(s))))return i;
  }
  return 3; // fallback
}

function buildColMap(headerRow){
  const m={};
  (headerRow||[]).forEach((v,i)=>{
    if(!v)return;
    const k=String(v).toLowerCase().trim().replace(/[\n\r\s]+/g,' ');
    m[k]=i;
    m[k.substring(0,20)]=i;
    m[k.replace(/[^a-z0-9 ]/g,'').trim()]=i;
  });
  return m;
}

function col(map,...keys){
  for(const k of keys){
    const kl=k.toLowerCase();
    // exact match first
    if(map[kl]!==undefined)return map[kl];
    // partial match
    const found=Object.keys(map).find(mk=>mk.includes(kl)||kl.includes(mk));
    if(found!==undefined)return map[found];
  }
  return -1;
}

// DSR PARSER — fully header-detected, zero hardcoded cols
// ════════════════════════════════════════════════════════
function parseDSRSheet(wb, sheetName){
  const sh=wb.Sheets[sheetName];if(!sh)return{recs:[],colMap:{}};
  const raw=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  const hi=findHeaderRow(raw);
  const hdrRow=raw[hi]||[];
  const C=buildColMap(hdrRow);

  // Detect date col: "start date" preferred, else "date"
  const dateCol=col(C,'start date','date');
  const tagCol=col(C,'tag','type','period tag');

  // Detect all metric columns by header name
  const colDefs={
    rev:        col(C,'booking rev','booking revenue','revenue'),
    mrp:        col(C,'booking mrp','mrp','gross mrp'),
    orders:     col(C,'book orders','booking orders','orders'),
    units:      col(C,'units'),
    net:        col(C,'net rev','nsv','net sales','gsv'),
    disc_pct:   col(C,'disc %','total disc %','total discount %','discount %'),
    cancel_pct: col(C,'total cancel order %','total \ncancel order %','cancel order %','cancel %'),
    fill_rate:  col(C,'fill rate','fill rate %'),
    spends:     col(C,'spends'),
    fb_spends:  col(C,'fb spends','facebook spends'),
    google_spends:col(C,'google spends'),
    roas:       col(C,'roas'),
    target:       col(C,'booking target'),
    target_gross: col(C,'target'),
    ga4_sessions: col(C,'ga4 sessions','ga sessions'),
    prepaid_pct:  col(C,'prepaid orders %','prepaid %'),
  };

  const recs=[];
  for(let i=hi+1;i<raw.length;i++){
    const r=raw[i];if(!r)continue;
    const tag=String(r[tagCol]||'').toLowerCase();
    if(!tag.includes('daily'))continue;
    const date=toISO(r[dateCol]);if(!date)continue;
    const rec={date};
    for(const[k,c]of Object.entries(colDefs)){rec[k]=c>=0?toN(r[c]):0;}
    recs.push(rec);
  }
  const dates=recs.map(r=>r.date).sort();
  return{recs,colMap:colDefs,headerRow:hdrRow,minDate:dates[0]||null,maxDate:dates[dates.length-1]||null};
}

function parseDSR(wb){
  const shNames=wb.SheetNames;
  const find=(...kw)=>shNames.find(n=>kw.some(k=>n.toLowerCase().includes(k)))||null;
  const hmSh=find('hm.in','hm in','hamleys.in','hamleys in');
  const ajSh=find('ajio');
  const amSh=find('amazon');
  const fkSh=find('flipkart');
  const jmSh=find('jiomart','jio mart');

  const hm=hmSh?parseDSRSheet(wb,hmSh):{recs:[],colMap:{}};
  const ajio=ajSh?parseDSRSheet(wb,ajSh):{recs:[],colMap:{}};
  const amazon=amSh?parseDSRSheet(wb,amSh):{recs:[],colMap:{}};
  const flipkart=fkSh?parseDSRSheet(wb,fkSh):{recs:[],colMap:{}};
  const jiomart=jmSh?parseDSRSheet(wb,jmSh):{recs:[],colMap:{}};

  const dates=[...hm.recs,...ajio.recs].map(r=>r.date).sort();
  return{hm,ajio,amazon,flipkart,jiomart,
    minDate:dates[0]||null,maxDate:dates[dates.length-1]||null,
    rows:hm.recs.length,
    sheetsFound:{hm:hmSh,ajio:ajSh,amazon:amSh,flipkart:fkSh,jiomart:jmSh}};
}

function parseDump(wb){

  const raw=XLSX.utils.sheet_to_json(wb.Sheets[shName],{header:1,raw:true,defval:null});
  // Header row 0 always for dump

  const C=buildColMap(hdrRow);
  const dateC=col(C,'date','order date');
  const brandC=col(C,'brand');
  const artC=col(C,'article','sku','article code');
  const descC=col(C,'description','product name','item name');
  const stateC=col(C,'state');
  const cityC=col(C,'city');
  const pinC=col(C,'pincode','pin code','pin');
  const grossC=col(C,'gross mrp','gross mrp value','mrp value');
  const couponC=col(C,'coupon discount','coupon disc');
  const storeDiscC=col(C,'store discount','store disc');
  const totalDiscC=col(C,'total discount','total disc');
  const ordersC=col(C,'orders','order qty','booked order');
  const unitsC=col(C,'units','qty','quantity','booked qty');
  const revC=col(C,'booked rev','booking rev','booked revenue','booking revenue','revenue');
  const netC=col(C,'net rev','net revenue','nsv');
  const catC=col(C,'category','product category');

  const recs=[];
  for(let i=1;i<raw.length;i++){
    const r=raw[i];if(!r||r.length<5)continue;
    const date=toISO(r[dateC>=0?dateC:0]);if(!date)continue;
    const rev=toN(r[revC>=0?revC:49]);if(rev===0)continue;
    const brand=String(r[brandC>=0?brandC:11]||'').trim();
    recs.push({date,brand,category:CATMAP[brand]||String(r[catC>=0?catC:62]||'').trim()||'Other',
      article:String(r[artC>=0?artC:9]||'').trim(),
      desc:String(r[descC>=0?descC:10]||'').trim().slice(0,60),
      state:String(r[stateC>=0?stateC:14]||'').trim(),
      city:String(r[cityC>=0?cityC:15]||'').trim(),
      pincode:String(r[pinC>=0?pinC:16]||'').replace(/\.0$/,'').trim(),
      gross:toN(r[grossC>=0?grossC:41]),
      coupon:toN(r[couponC>=0?couponC:43]),
      store_d:toN(r[storeDiscC>=0?storeDiscC:44]),
      total_d:toN(r[totalDiscC>=0?totalDiscC:45]),
      orders:toN(r[ordersC>=0?ordersC:47]),
      units:toN(r[unitsC>=0?unitsC:48]),rev,
      net:toN(r[netC>=0?netC:54])});
  }
  const dates=recs.map(r=>r.date).sort();
  return{recs,minDate:dates[0]||null,maxDate:dates[dates.length-1]||null,rows:recs.length,
    colsDetected:{date:dateC,brand:brandC,rev:revC,orders:ordersC,gross:grossC}};
}

function parseCamp(wb){
  const rows=[];
  for(const sn of wb.SheetNames){
    (XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null})||[]).forEach(r=>{
      if(!r||!r[0])return;const nm=String(r[0]).trim();
      if(["campaign","total","","nan"].includes(nm.toLowerCase()))return;
      const sp=toN(r[1]),rv=toN(r[2]);
      if(sp>100)rows.push({campaign:nm,sheet:sn,spends:sp,revenue:rv,roas:rv>0&&sp>0?rv/sp:0});
    });
  }
  return{campaigns:rows,rows:rows.length};
}

// Catalog parsers (header-detected)
function parseCatalogSheet(wb,fileId){
  const sh=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  const hi=findHeaderRow(raw,['article','brand','category','sku']);
  const C=buildColMap(raw[hi]||[]);
  const artC=col(C,'article','sku','article code');
  const descC=col(C,'description','product name','item');
  const brandC=col(C,'brand');
  const catC=col(C,'category');
  const liveC=col(C,'is_live','live','is live','active','is_active','is active');
  const mrpC=col(C,'mrp','selling price','price');

  return{recs,rows:recs.length,minDate:null,maxDate:null};
}

// ════════════════════════════════════════════════════════
// TARGETS — 100% from DSR file, nothing hardcoded
// ════════════════════════════════════════════════════════
function getTargets(P, dsrData){
  if(!P||!dsrData)return{booked:null,gross:null,total:null,src:{booked:'—',gross:'—',total:'—'}};
  const mk=`${P.year}-${String(P.monthNum).padStart(2,'0')}`;
  const monthSum=(recs,field)=>(recs||[]).filter(r=>r.date.startsWith(mk)).reduce((s,r)=>s+(r[field]||0),0);

  // Booking Target: HM.in DSR col "Booking Target" (col 23)
  const booked  = monthSum(dsrData.hm?.recs,   'target');
  // Gross MRP Target: HM.in DSR col "Target" (col 183)
  const gross   = monthSum(dsrData.hm?.recs,   'target_gross');
  // Channel targets for Total Ecom
  const ajioTgt = monthSum(dsrData.ajio?.recs,     'target');
  const amTgt   = monthSum(dsrData.amazon?.recs,   'target');
  const fkTgt   = monthSum(dsrData.flipkart?.recs, 'target');
  const jmTgt   = monthSum(dsrData.jiomart?.recs,  'target');
  const total   = (booked||0)+(ajioTgt||0)+(amTgt||0)+(fkTgt||0)+(jmTgt||0);

  const days=(recs)=>(recs||[]).filter(r=>r.date.startsWith(mk)).length;
  return{
    booked: booked||null,
    gross:  gross||null,
    total:  total||null,
    src:{
      booked: booked?`DSR · Booking Target · ${mk} · ${days(dsrData.hm?.recs)}d`:'Upload DSR',
      gross:  gross?`DSR · Target (GSV) · ${mk}`:'Upload DSR',
      total:  total?`DSR · All channels · ${mk}`:'Upload DSR',
    }
  };
}

// ════════════════════════════════════════════════════════
// AGGREGATE
// ════════════════════════════════════════════════════════
function agg(recs,s,e,keys){const f=recs.filter(r=>bet(r.date,s,e));const o={n:f.length};for(const k of keys)o[k]=f.reduce((a,r)=>a+(r[k]||0),0);return o;}
function avgK(recs,s,e,k){const f=recs.filter(r=>bet(r.date,s,e));return f.length?f.reduce((a,r)=>a+(r[k]||0),0)/f.length:0;}

// COMPUTE
// ════════════════════════════════════════════════════════
function compute(fd){
  const sd=fd.sales_dump,dsr=fd.dsr,camp=fd.campaign;
  const maxDate=sd?.maxDate||dsr?.maxDate||null;if(!maxDate)return null;
  const P=getPeriods(maxDate);
  const TGT=getTargets(P,dsr);
  const SK=["gross","coupon","store_d","total_d","orders","units","rev","net"];
  const DK=["rev","mrp","net","orders","units","disc_pct","cancel_pct","fill_rate","spends","fb_spends","google_spends","roas","target","target_gross","ga4_sessions"];
  const SA=(s,e)=>sd?agg(sd.recs,s,e,SK):{};
  const DA=(ch,s,e)=>dsr?.[ch]?.recs?agg(dsr[ch].recs,s,e,DK):{};
  const AV=(ch,s,e,k)=>avgK(dsr?.[ch]?.recs||[],s,e,k);
  const sm=SA(P.mtdS,P.mtdE),sp=SA(P.pmS,P.pmE),sw=SA(P.wtdS,P.wtdE),spw=SA(P.pwS,P.pwE);
  const hmM=DA("hm",P.mtdS,P.mtdE),hmP=DA("hm",P.pmS,P.pmE),hmW=DA("hm",P.wtdS,P.wtdE),hmPW=DA("hm",P.pwS,P.pwE);
  const ajM=DA("ajio",P.mtdS,P.mtdE),ajP=DA("ajio",P.pmS,P.pmE);
  const amM=DA("amazon",P.mtdS,P.mtdE),fkM=DA("flipkart",P.mtdS,P.mtdE),jmM=DA("jiomart",P.mtdS,P.mtdE);
  const totalM=(hmM.rev||0)+(ajM.rev||0)+(amM.rev||0)+(fkM.rev||0)+(jmM.rev||0);
  const BR=(s,e)=>{if(!sd)return{};const m={};sd.recs.filter(r=>bet(r.date,s,e)).forEach(r=>{if(!m[r.brand])m[r.brand]={rev:0,orders:0,units:0,gross:0,disc:0};m[r.brand].rev+=r.rev;m[r.brand].orders+=r.orders;m[r.brand].units+=r.units;m[r.brand].gross+=r.gross;m[r.brand].disc+=r.total_d;});return m;};
  const CR=(s,e)=>{if(!sd)return{};const m={};sd.recs.filter(r=>bet(r.date,s,e)).forEach(r=>{const c=r.category||"Other";if(!m[c])m[c]={rev:0,units:0,orders:0,gross:0,disc:0,store_d:0,coupon:0};m[c].rev+=r.rev;m[c].units+=r.units;m[c].orders+=r.orders;m[c].gross+=r.gross;m[c].disc+=r.total_d;m[c].store_d+=r.store_d;m[c].coupon+=r.coupon;});return m;};
  const TR=(s,e)=>{if(!sd)return{};const m={};sd.recs.filter(r=>bet(r.date,s,e)).forEach(r=>{const k=r.article||r.desc;if(!k)return;if(!m[k])m[k]={desc:r.desc,brand:r.brand,cat:r.category,rev:0,units:0,orders:0};m[k].rev+=r.rev;m[k].units+=r.units;m[k].orders+=r.orders;});return m;};
  const bM=BR(P.mtdS,P.mtdE),bP=BR(P.pmS,P.pmE),bW=BR(P.wtdS,P.wtdE),bPW=BR(P.pwS,P.pwE),bLY=BR(P.lylS,P.lylE);
  const cM=CR(P.mtdS,P.mtdE),cP=CR(P.pmS,P.pmE),cW=CR(P.wtdS,P.wtdE),cPW=CR(P.pwS,P.pwE);
  const tM=TR(P.mtdS,P.mtdE),tP=TR(P.pmS,P.pmE),tW=TR(P.wtdS,P.wtdE),tPW=TR(P.pwS,P.pwE);
  const allBr=[...new Set([...Object.keys(bM),...Object.keys(bP)])].filter(Boolean);
  const brands=allBr.map(b=>({brand:b,mtdR:bM[b]?.rev||0,pmR:bP[b]?.rev||0,wtdR:bW[b]?.rev||0,pwR:bPW[b]?.rev||0,lyR:bLY[b]?.rev||0,units:bM[b]?.units||0,orders:bM[b]?.orders||0,dPct:bM[b]?.gross>0?bM[b].disc/bM[b].gross*100:0,dPctP:bP[b]?.gross>0?bP[b].disc/bP[b].gross*100:0,wDPct:bW[b]?.gross>0?bW[b].disc/bW[b].gross*100:0,pwDPct:bPW[b]?.gross>0?bPW[b].disc/bPW[b].gross*100:0})).sort((a,b2)=>b2.mtdR-a.mtdR).slice(0,20);
  const allCat=[...new Set([...Object.keys(cM),...Object.keys(cP)])].filter(c=>c&&c!=="Other");
  const categories=allCat.map(c=>({cat:c,mtdR:cM[c]?.rev||0,pmR:cP[c]?.rev||0,wtdR:cW[c]?.rev||0,pwR:cPW[c]?.rev||0,units:cM[c]?.units||0,orders:cM[c]?.orders||0,dPct:cM[c]?.gross>0?cM[c].disc/cM[c].gross*100:0,dPctP:cP[c]?.gross>0?cP[c].disc/cP[c].gross*100:0,wDPct:cW[c]?.gross>0?cW[c].disc/cW[c].gross*100:0,pwDPct:cPW[c]?.gross>0?cPW[c].disc/cPW[c].gross*100:0,storeD:cM[c]?.gross>0?cM[c].store_d/cM[c].gross*100:0,couponD:cM[c]?.gross>0?cM[c].coupon/cM[c].gross*100:0})).sort((a,b2)=>b2.mtdR-a.mtdR);
  const allSKU=[...new Set([...Object.keys(tM),...Object.keys(tP)])];
  const topSellers=allSKU.map(k=>({desc:(tM[k]?.desc||tP[k]?.desc||k).slice(0,50),brand:tM[k]?.brand||"",cat:tM[k]?.cat||"",mtdR:tM[k]?.rev||0,pmR:tP[k]?.rev||0,wtdR:tW[k]?.rev||0,pwR:tPW[k]?.rev||0,mtdU:tM[k]?.units||0,pmU:tP[k]?.units||0})).sort((a,b2)=>b2.mtdR-a.mtdR).slice(0,25);
  const dM={tot:sm.gross>0?sm.total_d/sm.gross*100:0,store:sm.gross>0?sm.store_d/sm.gross*100:0,coupon:sm.gross>0?sm.coupon/sm.gross*100:0};
  const dP={tot:sp.gross>0?sp.total_d/sp.gross*100:0,store:sp.gross>0?sp.store_d/sp.gross*100:0,coupon:sp.gross>0?sp.coupon/sp.gross*100:0};
  const dW={tot:sw.gross>0?sw.total_d/sw.gross*100:0,store:sw.gross>0?sw.store_d/sw.gross*100:0,coupon:sw.gross>0?sw.coupon/sw.gross*100:0};
  const dPW={tot:spw.gross>0?spw.total_d/spw.gross*100:0,store:spw.gross>0?spw.store_d/spw.gross*100:0,coupon:spw.gross>0?spw.coupon/spw.gross*100:0};
  const days=Math.max(1,(new Date(P.mtdE)-new Date(P.mtdS))/86400e3+1);
  return{P,TGT,maxDate,days,
    summary:{totalM,grossM:sm.gross,bookedM:hmM.rev||0,projBooked:(hmM.rev||0)/days*30,projTotal:totalM/days*30,projGross:sm.gross/days*30},
    hm:{M:hmM,P:hmP,W:hmW,PW:hmPW,canM:AV("hm",P.mtdS,P.mtdE,"cancel_pct"),canP:AV("hm",P.pmS,P.pmE,"cancel_pct"),aovM:hmM.orders>0?hmM.rev/hmM.orders:0,aovP:hmP.orders>0?hmP.rev/hmP.orders:0,aovW:hmW.orders>0?hmW.rev/hmW.orders:0,aovPW:hmPW.orders>0?hmPW.rev/hmPW.orders:0,roasM:hmM.spends>0?hmM.rev/hmM.spends:0},
    ajio:{M:ajM,P:ajP},amazon:{M:amM},flipkart:{M:fkM},jiomart:{M:jmM},
    brands,categories,topSellers,disc:{M:dM,P:dP,W:dW,PW:dPW},
    campaigns:camp?.campaigns||[]};
}

async function handleFile(fid,file){
  if(!file)return;
  US[fid]={name:file.name,parsing:true};render();
  try{
    const buf=await file.arrayBuffer();
    const wb=await readWb(buf);
    let parsed=null;
    if(fid==="sales_dump")parsed=parseDump(wb);
    else if(fid==="dsr")parsed=parseDSR(wb);

    else parsed={raw:true,rows:"—"};
    FD[fid]=parsed;M=compute(FD);
    const dr=parsed?.minDate&&parsed?.maxDate?`${fmtDate(parsed.minDate)} → ${fmtDate(parsed.maxDate)}`:"";
    US[fid]={name:file.name,rows:parsed?.rows||"—",done:true,ts:new Date().toLocaleTimeString(),by:CU.name,dateRange:dr};
    saveData();updateHdr();showToast(`✓ ${file.name}${dr?" · "+dr:""}`);
  }catch(err){US[fid]={name:file.name,error:String(err).slice(0,150)};showToast("Error: "+String(err).slice(0,80));}
  render();
}

function noData(){return`<div style="text-align:center;padding:55px 20px"><div style="font-family:var(--disp);font-size:40px;color:var(--acc);letter-spacing:.1em">NO DATA</div><div style="font-size:12px;margin:7px 0 13px;color:#999">${CU?.role==="viewer"?"Ask your editor to upload files.":"Upload Sales Dump + DSR to load metrics"}</div>${CU?.role!=="viewer"?`<button onclick="switchTab('upload')" style="background:var(--red);color:#fff;border:none;padding:8px 18px;border-radius:var(--r);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer">Upload Files →</button>`:""}</div>`;}
function th(hs){return`<tr>${hs.map((h,i)=>`<th class="${i>0?'r':''}">${h}</th>`).join("")}</tr>`;}
function td(vs,t3=false){return`<tr${t3?" class='t3'":""}>${vs.map((v,i)=>`<td class="${i>0?'r':''}">${v}</td>`).join("")}</tr>`;}
function kpi(l,v,pv,b,pvL,ex,tgt){return`<div class="kc"><div class="kl">${l}</div><div class="kv">${v}</div>${pv?`<div class="kr">${b!==null&&b!==undefined?bdg(b):""}<span class="kp">${pvL||"prev"}: ${pv}</span></div>`:""}${ex?`<div class="ke">${ex}</div>`:""}${tgt?`<div style="margin-top:5px"><div style="display:flex;justify-content:space-between;font-size:9px;color:#bbb;margin-bottom:2px"><span>${tgt.l}</span><span>${cl(tgt.p).toFixed(0)}%</span></div><div style="background:var(--acc);height:3px;border-radius:2px;overflow:hidden"><div style="height:100%;width:${cl(tgt.p)}%;background:${tgt.p>=100?'var(--grn)':tgt.p>=80?'var(--amb)':'var(--red)'};transition:width .8s"></div></div></div>`:""}</div>`;}

function tgtCard(lbl,ach,tgt,proj,src){
  if(!tgt)return`<div class="tc"><div class="tl">${lbl}</div><div style="font-family:var(--mono);font-size:11px;color:#bbb;padding:10px 0">Target not set</div><div style="font-size:10px;color:#bbb">${src||""}</div><div style="margin-top:8px;font-size:11px;color:#555">Achieved: <strong>${fCr(ach)}</strong></div></div>`;
  const p=tgt>0?ach/tgt*100:0,pp=tgt>0?proj/tgt*100:0;
  const ok=p>=100,wn=p>=80;
  const col=ok?"var(--grn)":wn?"var(--amb)":"var(--red)";
  return`<div class="tc"><div class="tl">${lbl}</div><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><span class="tv" style="color:${col}">${fCr(ach)}</span><span style="font-size:10px;color:#bbb">/ ${fCr(tgt)}</span><span style="margin-left:auto;background:${ok?'var(--gbg)':wn?'#fff8e1':'var(--ebg)'};color:${col};font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px">${p.toFixed(1)}% ${ok?"✓ Beat":wn?"On Track":"At Risk"}</span></div><div class="tb"><div class="tf" style="width:${cl(p)}%;background:${col}"></div></div><div class="tn"><span>Gap: <strong>${fCr(Math.max(0,tgt-ach))}</strong></span><span>Proj: <strong style="color:${pp>=100?'var(--grn)':'var(--red)'}">${fCr(proj)}</strong></span></div><div style="font-size:9px;color:#bbb;margin-top:4px;font-family:var(--mono)">Source: ${src||"—"}</div></div>`;
}

function discH(l,v,pv,pvL,inv=false){const c=v>35?'var(--red)':v>25?'var(--amb)':'var(--blk)';return`<div class="dh"><div class="dhl">${l}</div><div class="dhv" style="color:${c}">${fP(v)}</div><div style="display:flex;gap:4px;align-items:center">${bdg(chg(v,pv),inv)}<span style="font-size:9px;color:#bbb">${pvL}: ${fP(pv)}</span></div></div>`;}

function tabCatalog(){

  if(!hasFynd&&!hasMaster)return`<div class="al al-a">Upload Catalog files to enable. Go to ↑ Upload tab.</div>`;
  const fyndMap={};if(FD.fynd_dump)FD.fynd_dump.recs.forEach(r=>fyndMap[r.article]=r);
  const sohMap={};if(FD.soh_file)FD.soh_file.recs.forEach(r=>sohMap[r.article]=(sohMap[r.article]||0)+r.soh);
  const masterMap={};if(FD.master_file)FD.master_file.recs.forEach(r=>masterMap[r.article]=r);
  const allArts=[...new Set([...Object.keys(masterMap),...Object.keys(fyndMap)])];
  const rows=allArts.map(a=>({article:a,desc:(masterMap[a]?.desc||fyndMap[a]?.desc||"").slice(0,50),brand:masterMap[a]?.brand||fyndMap[a]?.brand||"",category:masterMap[a]?.category||fyndMap[a]?.category||"",mrp:masterMap[a]?.mrp||fyndMap[a]?.mrp||0,inMaster:!!masterMap[a],activeMaster:masterMap[a]?.is_active||false,inFynd:!!fyndMap[a],liveFynd:fyndMap[a]?.is_live||false,soh:sohMap[a]||0}));
  const live=rows.filter(r=>r.liveFynd).length;
  const sohNotLive=rows.filter(r=>r.soh>0&&!r.liveFynd).sort((a,b)=>b.soh-a.soh);
  const liveNoSOH=rows.filter(r=>r.liveFynd&&r.soh===0);
  return`<div class="sec"><div class="sh"><span class="sn">07</span><span class="st">Catalog Health</span><span class="ss">${[hasMaster?"Master ✓":"Master —",hasFynd?"Fynd ✓":"Fynd —",hasSOH?"SOH ✓":"SOH —"].join(" · ")}</span></div><div class="kg">${kpi("Total SKUs (Master)",fN(Object.keys(masterMap).length))}${kpi("Active on hamleys.in",fN(rows.filter(r=>r.activeMaster).length))}${kpi("Live on Fynd",fN(live))}${kpi("SOH > 0 but NOT live",fN(sohNotLive.length),"","","","Launch opportunity")}${kpi("Live but zero SOH",fN(liveNoSOH.length),"","","","Cancellation risk")}</div>${sohNotLive.length>0?`<div class="sh" style="margin-top:6px"><span class="sn">↳</span><span class="st">Launch Opportunity — SOH > 0 not live (top 30)</span></div><div class="tw"><table><thead>${th(["Article","Description","Brand","Category","MRP","SOH"])}</thead><tbody>${sohNotLive.slice(0,30).map(r=>td([`<span style="font-family:var(--mono);font-size:10px">${r.article}</span>`,r.desc,r.brand,r.category,r.mrp>0?`₹${fN(r.mrp)}`:"—",fN(r.soh)])).join("")}</tbody></table></div>`:``}${liveNoSOH.length>0?`<div class="sh" style="margin-top:6px"><span class="sn">↳</span><span class="st">Cancellation Risk — live but zero SOH (top 20)</span></div><div class="tw"><table><thead>${th(["Article","Description","Brand","Category","MRP"])}</thead><tbody>${liveNoSOH.slice(0,20).map(r=>td([`<span style="font-family:var(--mono);font-size:10px">${r.article}</span>`,r.desc,r.brand,r.category,r.mrp>0?`₹${fN(r.mrp)}`:"—"])).join("")}</tbody></table></div>`:``}</div>`;
}

  const dsr=FD.dsr,sd=FD.sales_dump;
  if(!dsr&&!sd)return`<div class="al al-r">Upload DSR and/or Sales Dump first to verify.</div>`;
  let html=`<div class="sec"><div class="sh"><span class="sn">✓</span><span class="st">Data Verification Panel</span><span class="ss">Cross-check parsed values against your source file</span></div>`;

  if(dsr){
    const P=M?.P;
    const hmRecs=dsr.hm?.recs||[];
    const juneRecs=P?hmRecs.filter(r=>r.date.startsWith(`${P.year}-${String(P.monthNum).padStart(2,'0')}`)):[];
    const lastRow=hmRecs[0];

    html+=`<div class="sh"><span class="sn">DSR</span><span class="st">hamleys.in Sheet</span><span class="ss">Sheets found: ${Object.entries(dsr.sheetsFound||{}).filter(([k,v])=>v).map(([k,v])=>v).join(' · ')||'—'}</span></div>`;
    html+=`<div class="g2" style="margin-bottom:14px"><div class="cd"><div class="ct">Columns Detected (header-based)</div>`;
    if(dsr.hm?.colMap){
      const cm=dsr.hm.colMap;
      html+=Object.entries(cm).map(([k,v])=>`<div class="vrow"><span class="vlbl">${k}</span><span class="vval">col ${v>=0?v:<span style="color:var(--err)">NOT FOUND</span>}</span></div>`).join('');
    }
    html+=`</div><div class="cd"><div class="ct">Current Month — ${P?.month||'—'} ${P?.year||''} (${juneRecs.length} days with data)</div>`;
    if(juneRecs.length){
      const totRev=juneRecs.reduce((s,r)=>s+r.rev,0);
      const totOrd=juneRecs.reduce((s,r)=>s+r.orders,0);
      const totTgt=juneRecs.reduce((s,r)=>s+r.target,0);
      const totSpend=juneRecs.reduce((s,r)=>s+r.spends,0);
      html+=`<div class="vrow"><span class="vlbl">Booking Revenue</span><span><span class="vval">${fCr(totRev)}</span> <span class="vsrc">(${juneRecs.length}d)</span></span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Orders</span><span class="vval">${fN(totOrd)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Booking Target (col 23)</span><span><span class="vval" style="color:var(--grn)">${fCr(totTgt)}</span> <span class="vsrc">full month sum · no hardcoding</span></span></div>`;
      const grossTgtSum=juneRecs.reduce((s,r)=>s+(r.target_gross||0),0);
      html+=`<div class="vrow"><span class="vlbl">Gross MRP Target (col 183)</span><span><span class="vval" style="color:var(--grn)">${fCr(grossTgtSum)}</span> <span class="vsrc">full month sum</span></span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Total Spends</span><span class="vval">${fL(totSpend)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Cancel % (avg daily)</span><span class="vval">${fP(juneRecs.reduce((s,r)=>s+r.cancel_pct,0)/juneRecs.length*100)}</span></div>`;
      html+=`<div style="margin-top:10px"><div class="ct">Last 5 data rows parsed</div><div class="tw"><table><thead>${th(["Date","Orders","Rev","Target","Spends","Cancel%"])}</thead><tbody>${juneRecs.slice(0,5).map(r=>td([r.date,fN(r.orders),fL(r.rev),fL(r.target),fL(r.spends),fP(r.cancel_pct*100)])).join('')}</tbody></table></div></div>`;
    }else{
      html+=`<div style="color:#999;font-size:11px;padding:10px 0">No data rows found for ${P?.month||'current month'}. Check date column detection.</div>`;
    }
    html+=`</div></div>`;

    // AJIO verify
    const ajRecs=dsr.ajio?.recs||[];
    const ajMonthRecs=P?ajRecs.filter(r=>r.date.startsWith(`${P.year}-${String(P.monthNum).padStart(2,'0')}`)):[];
    html+=`<div class="sh" style="margin-top:8px"><span class="sn">AJIO</span><span class="st">AJIO Sheet Verification</span></div>`;
    html+=`<div class="cd" style="margin-bottom:11px"><div class="ct">AJIO — ${P?.month||'—'} ${P?.year||''} (${ajMonthRecs.length} days)</div>`;
    if(ajMonthRecs.length){
      html+=`<div class="vrow"><span class="vlbl">Revenue</span><span class="vval">${fL(ajMonthRecs.reduce((s,r)=>s+r.rev,0))}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Orders</span><span class="vval">${fN(ajMonthRecs.reduce((s,r)=>s+r.orders,0))}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Cancel % (avg)</span><span class="vval">${fP(ajMonthRecs.reduce((s,r)=>s+r.cancel_pct,0)/ajMonthRecs.length*100)}</span></div>`;
    }else{html+=`<div style="color:#999;font-size:11px">No AJIO rows for ${P?.month||'current month'}.</div>`;}
    html+=`</div>`;
  }

  if(sd){
    const P=M?.P;
    const monthRecs=P?sd.recs.filter(r=>r.date.startsWith(`${P.year}-${String(P.monthNum).padStart(2,'0')}`)):[];
    html+=`<div class="sh" style="margin-top:8px"><span class="sn">DUMP</span><span class="st">Sales Dump Verification</span><span class="ss">${fmtDate(sd.minDate)} → ${fmtDate(sd.maxDate)}</span></div>`;
    html+=`<div class="g2"><div class="cd"><div class="ct">Columns Detected</div>`;
    if(sd.colsDetected){Object.entries(sd.colsDetected).forEach(([k,v])=>{html+=`<div class="vrow"><span class="vlbl">${k}</span><span class="vval">col ${v>=0?v:'<span style="color:var(--err)">NOT FOUND</span>'}</span></div>`;});}
    html+=`</div><div class="cd"><div class="ct">${P?.month||'Current Month'} Summary (${monthRecs.length} rows)</div>`;
    if(monthRecs.length){
      const totRev=monthRecs.reduce((s,r)=>s+r.rev,0);
      const totGross=monthRecs.reduce((s,r)=>s+r.gross,0);
      const totDisc=monthRecs.reduce((s,r)=>s+r.total_d,0);
      html+=`<div class="vrow"><span class="vlbl">Booked Revenue</span><span class="vval">${fL(totRev)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Gross MRP</span><span class="vval">${fL(totGross)}</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Total Discount</span><span class="vval">${fL(totDisc)} (${totGross>0?fP(totDisc/totGross*100):"—"})</span></div>`;
      html+=`<div class="vrow"><span class="vlbl">Brands found</span><span class="vval">${[...new Set(monthRecs.map(r=>r.brand))].filter(Boolean).length}</span></div>`;
    }else{html+=`<div style="color:#999;font-size:11px">No rows for ${P?.month||'current month'}.</div>`;}
    html+=`</div></div>`;
  }
  html+=`</div>`;
  return html;
}

// ════════════════════════════════════════════════════════
// TAB: UPLOAD
// ════════════════════════════════════════════════════════
function tabUpload(){
  const can=CU?.role==="admin"||CU?.role==="editor";
  if(!can)return`<div class="al al-r">Viewer access — cannot upload files.</div>`;
  return`<div class="sec"><div class="sh"><span class="sn">↑</span><span class="st">Upload Data Files</span><span class="ss">All columns auto-detected by header name · xlsb + xlsx supported</span></div><div class="ug">${FDEFS.map(f=>{const st=US[f.id];const sh=st?.done?`<span style="background:var(--gbg);color:var(--grn);font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;margin-left:auto">✓</span>`:st?.parsing?`<span style="background:var(--abg);color:var(--amb);font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;margin-left:auto">…</span>`:st?.error?`<span style="background:var(--ebg);color:var(--err);font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;margin-left:auto">Err</span>`:"";return`<div class="uc ${st?.done?"done":st?.error?"err":""}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="font-size:17px">${f.icon}</span><div style="flex:1"><div style="font-size:12px;font-weight:500">${f.label}</div><div style="font-family:var(--mono);font-size:9px;color:#999;margin-top:1px">${f.hint}</div></div>${sh}</div><div style="font-size:10px;color:#888;border-left:2px solid var(--div);padding-left:7px;margin-bottom:7px;line-height:1.6">${f.cols}</div>${st?.done?`<div style="font-family:var(--mono);font-size:10px;color:#555;margin-bottom:6px;padding:6px 8px;background:var(--bg);border-radius:4px;line-height:1.7"><strong>${st.by}</strong> · ${st.ts}${st.dateRange?" · "+st.dateRange:""}<br>${typeof st.rows==="number"?st.rows.toLocaleString():st.rows} rows</div>`:""}${st?.error?`<div style="font-size:10px;color:var(--err);margin-bottom:5px">${st.error}</div>`:""}<label><div class="dz" id="dz-${f.id}">Drop .xlsb / .xlsx or click</div><input type="file" accept=".xlsx,.xlsb,.xls,.csv" onchange="handleFile('${f.id}',this.files[0])"></label></div>`;}).join("")}</div>${Object.keys(US).length>0?`<div style="margin-top:12px"><button class="btn-g" onclick="clearAll()">Clear all data</button></div>`:""}</div>`;
}

// ════════════════════════════════════════════════════════
// TAB: ADMIN
// ════════════════════════════════════════════════════════
function tabAdmin(){
  if(CU?.role!=="admin")return`<div class="al al-r">Admin access only.</div>`;
  const P=M?.P;
  const monthKey=P?`${P.year}-${String(P.monthNum).padStart(2,'0')}`:"";
  const stored=getStoredTargets();
  const cur=stored[monthKey]||{};
  const rc={admin:"r-admin",editor:"r-editor",viewer:"r-viewer"};
  const bookedFromDSR=M?.TGT?.booked&&M?.TGT?.src?.booked?.includes('DSR')?M.TGT.booked:null;

  return`<div class="sec">
    <div class="sh"><span class="sn">⚙</span><span class="st">Monthly Targets — ${P?.month||'—'} ${P?.year||''}</span><span class="ss">Set targets per month. Booking auto-read from DSR if not overridden.</span></div>
    <div class="g2" style="margin-bottom:20px">
      <div class="cd">
        <div class="ct">Current Month Target Status</div>
        <div class="vrow"><span class="vlbl">Booking Rev Target</span><span><span class="vval" style="color:var(--grn)">${bookedFromDSR?fCr(bookedFromDSR):cur.booked?fCr(cur.booked*1e7):"—"}</span> <span class="vsrc">${M?.TGT?.src?.booked||"—"}</span></span></div>
        <div class="vrow"><span class="vlbl">Gross MRP Target</span><span><span class="vval">${cur.gross?fCr(cur.gross*1e7):"Not set"}</span> <span class="vsrc">${cur.gross?"Admin override":"—"}</span></span></div>
        <div class="vrow" style="border:none"><span class="vlbl">Total Ecom Target</span><span><span class="vval">${cur.total?fCr(cur.total*1e7):"Not set"}</span> <span class="vsrc">${cur.total?"Admin override":"—"}</span></span></div>
      </div>
      <div class="cd">
        <div class="ct">Set / Override Targets for ${P?.month||'—'} ${P?.year||''}</div>
        <div class="al al-a" style="margin-bottom:10px;font-size:10px">Booking target is auto-read from DSR. Enter values below to override or add Gross MRP / Total Ecom targets. Enter in <strong>Crores</strong> (e.g. 1.84 for ₹1.84Cr).</div>
        <div style="margin-bottom:8px">
          <label class="llab" style="margin-bottom:3px">Gross MRP Target (₹Cr)</label>
          <input id="tgt-gross" class="fi" type="number" step="0.01" placeholder="e.g. 2.12" value="${cur.gross||''}">
        </div>
        <div style="margin-bottom:8px">
          <label class="llab" style="margin-bottom:3px">Booking Rev Target (₹Cr) — overrides DSR</label>
          <input id="tgt-booked" class="fi" type="number" step="0.01" placeholder="${bookedFromDSR?'DSR: '+fCr(bookedFromDSR)+' (leave blank to use DSR)':'e.g. 1.84'}" value="${cur.booked||''}">
        </div>
        <div style="margin-bottom:12px">
          <label class="llab" style="margin-bottom:3px">Total Ecom Target (₹Cr)</label>
          <input id="tgt-total" class="fi" type="number" step="0.01" placeholder="e.g. 2.30" value="${cur.total||''}">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-r" onclick="saveMonthTargets('${monthKey}')">Save Targets →</button>
          <button class="btn-g" onclick="clearMonthTargets('${monthKey}')">Clear Override</button>
        </div>
      </div>
    </div>
    <div class="sh"><span class="sn">⚙</span><span class="st">Team Access Management</span></div>
    <div class="ag">
      <div class="cd"><div class="ct">Current Users</div>${USERS.map(u=>`<div class="aur"><div><div style="font-size:12px;font-weight:500">${u.name} <span style="font-family:var(--mono);font-size:10px;color:#999">(${u.username})</span></div></div><div style="display:flex;align-items:center;gap:7px"><span class="ar ${rc[u.role]||''}">${u.role}</span>${u.username!=="sneha"&&u.username!=="kanisht"?`<button class="adel" onclick="delUser('${u.username}')">✕</button>`:""}</div></div>`).join("")}</div>
      <div class="cd"><div class="ct">Add / Update User</div><div class="fr"><input id="nu-n" class="fi" type="text" placeholder="Full name"><input id="nu-u" class="fi" type="text" placeholder="Username (lowercase)"></div><div class="fr"><input id="nu-p" class="fi" type="password" placeholder="Password"><select id="nu-r" class="fs"><option value="viewer">Viewer</option><option value="editor">Editor</option><option value="admin">Admin</option></select></div><button class="btn-r" onclick="addUser()">Add / Update →</button></div>
    </div>
  </div>`;
}

function saveMonthTargets(mk){
  const g=parseFloat(document.getElementById("tgt-gross").value)||null;
  const b=parseFloat(document.getElementById("tgt-booked").value)||null;
  const t=parseFloat(document.getElementById("tgt-total").value)||null;
  const stored=getStoredTargets();
  stored[mk]={gross:g,booked:b,total:t};
  saveTargets(stored);
  M=compute(FD);
  render();showToast("✓ Targets saved for "+mk);
}


async function addUser(){const n=document.getElementById("nu-n").value.trim();const u=document.getElementById("nu-u").value.trim().toLowerCase();const p=document.getElementById("nu-p").value;const r=document.getElementById("nu-r").value;if(!n||!u||!p){showToast("Fill all fields");return;}const h=await sha(p);const idx=USERS.findIndex(x=>x.username===u);if(idx>=0)USERS[idx]={username:u,name:n,hash:h,role:r};else USERS.push({username:u,name:n,hash:h,role:r});localStorage.setItem("hm_users3",JSON.stringify(USERS));showToast(`✓ ${n} (${r}) saved`);render();}
function delUser(u){if(!confirm(`Remove ${u}?`))return;USERS=USERS.filter(x=>x.username!==u);localStorage.setItem("hm_users3",JSON.stringify(USERS));showToast(`${u} removed`);render();}
function clearAll(){if(!confirm("Clear all data?"))return;FD={};US={};M=null;localStorage.removeItem("hm_fd5");localStorage.removeItem("hm_st5");document.getElementById("hdr-d").textContent="No data";document.getElementById("ftr-d").textContent="—";document.getElementById("ftr-r").textContent="No data";render();showToast("Cleared");}

// ════════════════════════════════════════════════════════
// RENDER + NAV
// ════════════════════════════════════════════════════════
function render(){
  const map={targets:tabTargets,overview:tabOverview,brands:tabBrands,categories:tabCategories,sellers:tabSellers,discounts:tabDiscounts,catalog:tabCatalog,verify:tabVerify,upload:tabUpload,admin:tabAdmin};
  document.getElementById("content").innerHTML=(map[AT]||tabTargets)();
  FDEFS.forEach(f=>{const dz=document.getElementById(`dz-${f.id}`);if(!dz)return;dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("dg");});dz.addEventListener("dragleave",()=>dz.classList.remove("dg"));dz.addEventListener("drop",async e=>{e.preventDefault();dz.classList.remove("dg");const file=e.dataTransfer.files[0];if(file)await handleFile(f.id,file);});});
}
function switchTab(id){AT=id;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===id));render();}
document.getElementById("tabs").addEventListener("click",e=>{if(e.target.dataset.tab)switchTab(e.target.dataset.tab);});

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
(async()=>{await initUsers();loadData();if(await checkSess())showApp();else document.getElementById("liu").focus();})();
</script>
